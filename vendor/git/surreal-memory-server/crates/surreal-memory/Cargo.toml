[package]
name = "surreal-memory"
version = "0.1.0"
edition = "2024"
description = "Embeddable SurrealDB-backed agent memory library with knowledge graph, scoped memory, TaskStreams, mindmaps, and Graph-RAG"
license = "MIT"
repository = "https://github.com/gqadonis/surreal-memory-server"
documentation = "https://docs.rs/surreal-memory"
readme = "README.md"
keywords = ["memory", "surrealdb", "agent", "knowledge-graph", "mcp"]
categories = ["database", "data-structures"]


[lib]
name = "surreal_memory"
path = "src/lib.rs"

[features]
default = ["embedded"]
embedded = ["surrealdb/kv-rocksdb"]
# Preserve the upstream cfg vocabulary without shipping the unintegrated
# mempalace dependency. UAR never enables this empty compatibility marker.
palace = []
local-embeddings = [
    "candle-core",
    "candle-nn",
    "candle-transformers",
    "tokenizers",
    "hf-hub",
]
cuda = [
    "local-embeddings",
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
]
metal = [
    "local-embeddings",
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
]

[dependencies]
tokio = { version = "1.50.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
surrealdb = "3.2.0"
surrealdb_types = { package = "surrealdb-types", version = "3.2.0" }
anyhow = "1.0.102"
thiserror = "2.0.18"
sha2 = "0.11.0"
tracing = "0.1.44"
async-trait = "0.1.89"
chrono = "0.4.44"
reqwest = { version = "0.13.2", features = ["json"] }
tiktoken-rs = "0.9.1"
uuid = { version = "1.23.0", features = ["v4", "fast-rng"] }

# Candle local embeddings (optional)
candle-core = { version = "0.9.2", optional = true }
candle-nn = { version = "0.9.2", optional = true }
candle-transformers = { version = "0.9.2", optional = true }
tokenizers = { version = "0.22.2", optional = true }
hf-hub = { version = "0.5.0", features = ["tokio"], optional = true }

# Utilities
dirs = "6"
rand = "0.10.0"
arc-swap = "1.7"
