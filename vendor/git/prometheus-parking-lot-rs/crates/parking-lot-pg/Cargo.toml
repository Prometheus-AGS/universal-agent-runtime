[package]
name = "prometheus-parking-lot-pg"
description = "Postgres lease queue and result mailbox backends for prometheus_parking_lot."
documentation = "https://docs.rs/prometheus-parking-lot-pg"
keywords = ["scheduler", "queue", "postgres", "ai"]
categories = ["asynchronous", "database"]
readme = "README.md"
include = ["/src/**", "/migrations/**", "/Cargo.toml", "/README.md", "/LICENSE*"]
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
authors = ["Prometheus AI Team"]
repository = "https://github.com/Prometheus-AGS/prometheus-parking-lot-rs"
homepage = "https://github.com/Prometheus-AGS/prometheus-parking-lot-rs"
license = "MIT"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
prometheus-parking-lot-core = { path = "../parking-lot-core", version = "0.4.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = { version = "0.1" }

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(parking_lot_loom)", "cfg(parking_lot_negative_control, values(any()))"] }

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[dev-dependencies]
prometheus-parking-lot-core = { path = "../parking-lot-core", version = "0.4.0", features = ["conformance"] }
testcontainers = { version = "0.28" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
