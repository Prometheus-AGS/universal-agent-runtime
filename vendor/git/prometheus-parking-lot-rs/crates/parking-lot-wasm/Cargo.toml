[package]
name = "prometheus-parking-lot-wasm"
description = "WASM WorkerPool for prometheus_parking_lot (async tasks instead of OS threads)."
documentation = "https://docs.rs/prometheus-parking-lot-wasm"
keywords = ["scheduler", "wasm", "worker", "ai"]
categories = ["asynchronous", "wasm"]
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE*"]
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
authors = ["Prometheus AI Team"]
repository = "https://github.com/Prometheus-AGS/prometheus-parking-lot-rs"
homepage = "https://github.com/Prometheus-AGS/prometheus-parking-lot-rs"
license = "MIT"

[package.metadata.docs.rs]
all-features = true
# The implementation is wasm32-only; the default (native) docs.rs build is empty.
targets = ["wasm32-unknown-unknown"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
prometheus-parking-lot-core = { path = "../parking-lot-core", version = "0.4.0" }

# The implementation compiles only for wasm32 (see src/lib.rs), so its
# dependencies are not built for other targets.
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-channel = { version = "0.3" }
gloo-timers = { version = "0.4", features = ["futures"] }
js-sys = { version = "0.3" }
parking_lot = { version = "0.12" }
tracing = { version = "0.1" }
wasm-bindgen-futures = { version = "0.4" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
async-trait = { version = "0.1" }
wasm-bindgen-test = { version = "0.3" }

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(parking_lot_loom)", "cfg(parking_lot_negative_control, values(any()))"] }

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
