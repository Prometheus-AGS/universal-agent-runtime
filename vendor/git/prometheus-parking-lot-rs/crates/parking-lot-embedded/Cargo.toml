[package]
name = "prometheus-parking-lot-embedded"
description = "Crash-safe embedded (redb) lease queue and result mailbox for prometheus_parking_lot (desktop and single-node)."
documentation = "https://docs.rs/prometheus-parking-lot-embedded"
keywords = ["scheduler", "queue", "embedded", "tauri", "ai"]
categories = ["asynchronous", "filesystem"]
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE*"]
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
authors = ["Prometheus AI Team"]
repository = "https://github.com/Prometheus-AGS/prometheus-parking-lot-rs"
homepage = "https://github.com/Prometheus-AGS/prometheus-parking-lot-rs"
license = "MIT"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Test-only: lets the crash-point tests stop the process at named points inside
# a queue or mailbox operation (`PARKING_LOT_FAULT_POINT=<point>`). Never enable
# it in a deployment. Enabled for this crate's own tests by the self
# dev-dependency below.
fault-injection = []

[dependencies]
prometheus-parking-lot-core = { path = "../parking-lot-core", version = "0.4.0" }
redb = { version = "4.4" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
# `spawn_blocking` keeps redb's synchronous, fsyncing transactions off async
# worker threads.
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
prometheus-parking-lot-core = { path = "../parking-lot-core", version = "0.4.0", features = ["conformance"] }
# Path-only: cargo strips a dev-dependency that has no version when it packages,
# so the unpublished crate does not have to resolve itself on crates.io.
prometheus-parking-lot-embedded = { path = ".", features = ["fault-injection"] }
tempfile = { version = "3.14" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(parking_lot_loom)", "cfg(parking_lot_negative_control, values(any()))"] }

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
