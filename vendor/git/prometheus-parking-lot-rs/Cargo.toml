# Standalone vendored facade; inheritance is materialized for UAR consumption.

[package]
name = "prometheus_parking_lot"
description = "Runtime-agnostic, resource-aware parking-lot scheduler for AI agent and inference workloads."
documentation = "https://docs.rs/prometheus_parking_lot"
readme = "README.md"
keywords = ["scheduler", "queue", "tokio", "gpu", "ai"]
categories = ["asynchronous", "concurrency"]
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE*", "/CHANGELOG.md"]
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
authors = ["Prometheus AI Team"]
repository = "https://github.com/Prometheus-AGS/prometheus-parking-lot-rs"
homepage = "https://github.com/Prometheus-AGS/prometheus-parking-lot-rs"
license = "MIT"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["tokio-runtime"]
# Async ResourcePool, native WorkerPool, shutdown, cancellation, TokioSpawner.
tokio-runtime = ["dep:prometheus-parking-lot-runtime-tokio"]
# Postgres lease queue, result mailbox and audit schema (raw sqlx).
postgres = ["dep:prometheus-parking-lot-pg"]
# Embedded redb-backed lease queue and result mailbox (ADR 0004).
embedded = ["dep:prometheus-parking-lot-embedded"]
# Apache Iggy lifecycle events and mailbox notifications (IggyHook, IggyNotifier).
iggy = ["dep:prometheus-parking-lot-iggy"]

[dependencies]
prometheus-parking-lot-core = { path = "crates/parking-lot-core", version = "0.4.0" }
prometheus-parking-lot-runtime-tokio = { path = "crates/parking-lot-runtime-tokio", version = "0.4.0", optional = true }
prometheus-parking-lot-pg = { path = "crates/parking-lot-pg", version = "0.4.0", optional = true }
prometheus-parking-lot-embedded = { path = "crates/parking-lot-embedded", version = "0.4.0", optional = true }
prometheus-parking-lot-iggy = { path = "crates/parking-lot-iggy", version = "0.4.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
prometheus-parking-lot-wasm = { path = "crates/parking-lot-wasm", version = "0.4.0" }

[dev-dependencies]
async-trait = { version = "0.1" }
criterion = { version = "0.8.1", features = ["async_tokio"] }
parking_lot = { version = "0.12" }
tempfile = { version = "3.14" }
testcontainers = { version = "0.28" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# Benchmark suites (cr-40); see benches/README.md. The redb case of
# `throughput` and `latency` needs the `embedded` feature: run with
# `--all-features`, as CI does.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(parking_lot_loom)", "cfg(parking_lot_negative_control, values(any()))"] }

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

# Coverage profile for cargo-tarpaulin and cargo-llvm-cov
[profile.coverage]
inherits = "test"
debug = true
