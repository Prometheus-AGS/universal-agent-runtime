features = ["ecdsa"]
default-features = false

[dependencies.p384]
version = "0.14.0"
features = ["ecdsa"]
default-features = false

[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[dependencies.serde_json]
version = "1.0.154"

[dependencies.sha2]
version = "0.10.9"

[dependencies.signature]
version = "3"
default-features = false

[dependencies.ssh-key]
version = "=0.7.0-rc.12"
features = [
    "alloc",
    "ed25519",
    "p256",
]
default-features = false

[dependencies.thiserror]
version = "2.0.21"

[dependencies.x509-parser]
version = "0.18.1"
default-features = false

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.sigstore-verify]
