[package]
name = "universal-agent-runtime-sdk"
version = "1.0.0"
edition = "2024"
description = "Rust SDK for universal-agent-runtime - HTTP client and embeddable runtime. MIT-licensed, including the 'embedded' feature that links the runtime crate directly."
repository = "https://github.com/Prometheus-AGS/universal-agent-runtime"
authors = ["Prometheus AGS"]
license = "MIT"
keywords = ["sdk", "client", "api", "llm", "agent"]
categories = ["api-bindings", "web-programming"]

[features]
default = ["http-client"]
http-client = ["dep:reqwest", "dep:tokio-stream", "dep:webpki-root-certs"]
embedded = ["dep:universal-agent-runtime", "universal-agent-runtime/host-persistence"]
embedded-mobile = ["embedded", "universal-agent-runtime/embedded-mobile"]
server = ["embedded", "universal-agent-runtime/minimal"]
full = ["http-client", "server"]
# Verification host only; the shipped embedded-mobile defaults stay transport-free.
ios-acceptance = ["embedded-mobile", "universal-agent-runtime/surreal-backend", "dep:liter-llm"]

[dependencies]
# Shared dependencies
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miette = "7.6"
thiserror = "2.0"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
url = "2.5"

# HTTP client mode
# The SDK is embedded into Android/iOS clients. Select the same rustls backend
# as the rest of UAR explicitly and enable only the client features used here.
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "multipart", "query", "stream", "rustls"], optional = true }
tokio-stream = { version = "0.1", optional = true }
webpki-root-certs = { version = "=1.0.11", optional = true }

# The simulator acceptance host constructs the same genuine driver as UAR.
liter-llm = { path = "../../vendor/git/liter-llm/crates/liter-llm", features = ["full"], optional = true }

# Embedded mode - re-export the core crate
universal-agent-runtime = { version = "=1.4.0-rc.1", path = "../..", optional = true, default-features = false }

[dev-dependencies]
tokio-test = "0.4"
# Test-only: enable the runtime's in-memory persistence backend so embedded
# admin/policy tests can build a Runtime without a real database. This does NOT
# widen the shipped `embedded` feature set — it only affects `cargo test`.
universal-agent-runtime = { path = "../..", default-features = false, features = [
    "host-persistence",
    "in-memory-backend",
] }

# The SDK is released independently from the runtime workspace.
[workspace]

[[example]]
name = "ios_acceptance"
path = "../../scripts/acceptance/ios/rust/lib.rs"
crate-type = ["staticlib"]
required-features = ["ios-acceptance"]

[patch.crates-io]
# Match UAR's observed iOS FP16 correction under this independent lockfile.
gemm-common = { path = "../../vendor/patches/gemm-common-0.19.0" }
# Independent SDK builds need the same awaited datastore lifecycle as UAR.
surrealdb = { path = "../../vendor/patches/surrealdb-lifecycle/surrealdb-3.3.0" }
surrealdb-engine-api = { path = "../../vendor/patches/surrealdb-lifecycle/surrealdb-engine-api-3.3.0" }
surrealdb-engine-local = { path = "../../vendor/patches/surrealdb-lifecycle/surrealdb-engine-local-3.3.0" }
surrealdb-core = { path = "../../vendor/patches/surrealdb-lifecycle/surrealdb-core-3.3.0" }
surrealdb-kvs-surrealkv = { path = "../../vendor/patches/surrealdb-lifecycle/surrealdb-kvs-surrealkv-3.3.0" }
surrealdb-kvs-rocksdb = { path = "../../vendor/patches/surrealdb-lifecycle/surrealdb-kvs-rocksdb-3.3.0" }
