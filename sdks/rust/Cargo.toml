[package]
name = "universal-agent-runtime-sdk"
version = "1.0.0"
edition = "2024"
description = "Rust SDK for universal-agent-runtime - HTTP client and embeddable runtime. MIT-licensed, including the 'embedded' feature that links the runtime crate directly."
repository = "https://github.com/Prometheus-AGS/universal-agent-runtime"
license = "MIT"
keywords = ["sdk", "client", "api", "llm", "agent"]
categories = ["api-bindings", "web-programming"]

[features]
default = ["http-client"]
http-client = ["dep:reqwest", "dep:tokio-stream"]
embedded = ["dep:universal-agent-runtime", "universal-agent-runtime/host-persistence"]
embedded-mobile = ["embedded", "universal-agent-runtime/embedded-mobile"]
server = ["embedded", "universal-agent-runtime/minimal"]
full = ["http-client", "server"]

[dependencies]
# Shared dependencies
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miette = "7.6"
thiserror = "2.0"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
url = "2.5"

# HTTP client mode
# The SDK is embedded into Android/iOS clients. Reqwest's default native-tls
# feature pulls openssl-sys when cross-compiling Android; use the same portable
# rustls backend as the rest of UAR instead.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"], optional = true }
tokio-stream = { version = "0.1", optional = true }

# Embedded mode - re-export the core crate
universal-agent-runtime = { path = "../..", optional = true, default-features = false }

[dev-dependencies]
tokio-test = "0.4"
# Test-only: enable the runtime's in-memory persistence backend so embedded
# admin/policy tests can build a Runtime without a real database. This does NOT
# widen the shipped `embedded` feature set — it only affects `cargo test`.
universal-agent-runtime = { path = "../..", default-features = false, features = [
    "host-persistence",
    "in-memory-backend",
] }

# The SDK is released independently from the runtime workspace.
[workspace]
