[project]
name = "universal-agent-runtime-sdk"
version = "1.0.0"
description = "Typed async Python SDK for Universal Agent Runtime"
authors = [{ name = "Prometheus AGS" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.0.0",
    "build>=1.2.0",
    "hatchling>=1.27.0",
    "sphinx>=7.0.0",
    "furo>=2024.8.6",
]

[project.urls]
Homepage = "https://github.com/Prometheus-AGS/universal-agent-runtime"
Repository = "https://github.com/Prometheus-AGS/universal-agent-runtime"
Documentation = "https://github.com/Prometheus-AGS/universal-agent-runtime#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/universal_agent_runtime_sdk"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["universal_agent_runtime_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
