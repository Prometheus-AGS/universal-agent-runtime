syntax = "proto3";
package a2a;

service AgentService {
  rpc MessageSend (SendMessageRequest) returns (TaskResponse);
  rpc TaskGet (GetTaskRequest) returns (TaskResponse);
  rpc TaskCancel (CancelTaskRequest) returns (TaskResponse);
  rpc MessageStream (SendMessageRequest) returns (stream TaskEvent);
}

message SendMessageRequest {
  string task_id = 1;
  Message message = 2;
}

message GetTaskRequest {
  string task_id = 1;
}

message CancelTaskRequest {
  string task_id = 1;
}

message Message {
  string role = 1;
  repeated Part parts = 2;
}

message Part {
  oneof content {
    string text = 1;
    bytes data = 2;
  }
  string content_type = 3;
}

message TaskResponse {
  string task_id = 1;
  string status = 2;  // submitted, working, completed, failed, canceled
  repeated Message messages = 3;
  repeated Artifact artifacts = 4;
}

message Artifact {
  string name = 1;
  repeated Part parts = 2;
}

message TaskEvent {
  string task_id = 1;
  string event_type = 2;  // status_update, message, artifact
  TaskResponse state = 3;
}
