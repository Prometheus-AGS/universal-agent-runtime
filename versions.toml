# Authoritative architecture decisions and dependency pins.
# Agents must not contradict this file, and must not edit it — .claude/settings.json
# denies Edit(versions.toml). Change it deliberately, by hand.

[meta]
created = "2026-08-09"

[pins]
# Vitest rejects mixed runtime/browser package versions; keep the runner,
# browser provider, coverage, and UI packages aligned on the 5.0.5 set.
# Operator retained the current source on 2026-11-04; qualification is pending.
vitest = "5.0.5"
# The UAR catalog and A2UI renderer exchange schema objects across one
# Zod 4 core. RC4 qualification covers both UAR and the independent PEM client.
zod = "4.6.7"
# Vite resolves entity-graph-core's optional Loro import during browser startup;
# 1.13.9 is the entity package's tested peer version.
loro_crdt = "1.13.9"
# Operator retained current committed Liter source on 2026-10-31, including
# prepared streaming bodies for UAR accounting. Qualification remains required.
liter_llm = "2.3.0"
liter_llm_commit = "0c0376ba4c2be77703fb295dd5ca42f95b5e4c20"
# Surreal Memory is pinned to the exact dependency commit rebased on the
# reviewed documentation and native-MLX remote head.
surreal_memory_server_base_commit = "e5f48916048a8e26d3ace83c44746b8105f0696c"
surreal_memory_server_commit = "9e36b1cd8b83a657366eb1e3ef8cd837178336de"
# Operator approved UAR main 2cc9a182's exact skill-resource gitlink on 2026-10-11.
# Effective runtime overrides and migration acceptance are recorded separately.
prometheus_skill_system_base_commit = "f0df1e0121d176c9467e5c71022737b845af6a20"
prometheus_skill_system_commit = "11193ea6394813ab0d916461f6fd8638a4bc674f"
# Active embedded SDK, schema types, and standalone companion server.
surrealdb = "4.0.0"
surrealdb_types = "4.0.0"
surrealdb_server = "4.0.0"
surrealdb_image = "surrealdb/surrealdb:v4.0.0@sha256:c35893410644e65fa90aa1bef446ac9cb0a0c2733b9d405ce3eb56754b85c330"
# JavaScript advisory closure is lockfile-scoped across the root, frontend,
# and documentation package roots.
