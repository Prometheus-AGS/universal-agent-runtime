[package]
name = "universal-agent-runtime"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
path = "src/lib.rs"

[[bin]]
name = "universal-agent-runtime"
path = "src/main.rs"

[dev-dependencies]
anyhow = "1.0"
axum-test = "19.1.1"
serial_test = "3.4.0"
tempfile = "3.27.0"
tokio = { version = "1.50.0", features = ["full", "test-util"] }
tower = { version = "0.5.2", features = ["util"] }

# Testing infrastructure dependencies
grcov = "0.8"
testcontainers = "0.23"
mockall = "0.13"
tokio-test = "0.4"
rustls = { version = "0.23.37", features = ["ring"] }

[build-dependencies]
burn-import = { version = "0.20.1", optional = true }
ureq = "3.2.0"
serde_json = "1.0"
serde = { version = "1", features = ["derive"] }

[features]
default = []
model-build = ["dep:burn-import"]
sqlx = []
tauri = []
wasm-runtime = ["dep:wasmtime", "dep:wasmtime-wasi"]


[dependencies]
# Web framework
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6.8", features = [
  "fs",
  "cors",
  "trace",
  "timeout",
] }


# Async runtime
tokio = { version = "1", features = ["full", "process"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.147"

# Async utilities
futures = "0.3.32"
async-stream = "0.3"
async-trait = "0.1"

# Actor model
ractor = "0.15.12"

# Governance policy engine
cedar-policy = "4.9.1"

# Wasm runtime (feature-gated)
wasmtime = { version = "41.0.3", optional = true }
wasmtime-wasi = { version = "41.0.3", optional = true }

# HTTP client
reqwest = { version = "0.12", features = [
  "json",
  "stream",
  "rustls-tls-native-roots",
  "multipart",
] }

# MCP client + in-process server (memory MCP)
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", rev = "085470025f690050e8776ffa939e7ba71d3abc01", features = [
  "client",
  "server",
  "macros",
  "reqwest",
  "transport-child-process",
  "transport-io",
  "transport-streamable-http-client-reqwest",
  "transport-streamable-http-server",
  "transport-streamable-http-server-session",
] }

# Memory system — surreal-memory library
surreal-memory = { git = "https://github.com/Prometheus-AGS/surreal-memory-server", branch = "main", package = "surreal-memory", features = ["embedded"] }

# Utilities
url = "2.5.7"
uuid = { version = "1.21.0", features = ["v4", "serde"] }
dotenvy = "0.15.7"
clap = { version = "4.6.0", features = ["derive", "env"] }

# Performance (M-MIMALLOC-APPS)
mimalloc = "0.1"

# Observability (M-LOG-STRUCTURED)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0.100"
axum-extra = { version = "0.12.3", features = [
  "typed-routing",
  "typed-header",
] }
tower = "0.5.2"
tokio-stream = { version = "0.1.17", features = ["net", "sync"] }
serde_yml = "0.0.12"
burn = { version = "0.20.1", default-features = false, features = [
  "wgpu",
  "train",
  "ndarray",
] }
tokenizers = { version = "0.22.2", default-features = false, features = [
  "onig",
  "esaxx_fast",
] }
tiktoken-rs = "0.9.1"
sqlx = { version = "0.8.6", features = [
  "runtime-tokio-native-tls",
  "postgres",
  "uuid",
  "chrono",
  "json",
  "migrate",
] }
pgvector = { version = "0.4.1", features = ["sqlx"] }
text-splitter = "0.29.3"
chrono = { version = "0.4.44", features = ["serde"] }
walkdir = "2.5.0"
jsonwebtoken = "10.2.0"
tracing-opentelemetry = "0.32.0"
opentelemetry = "0.31.0"
opentelemetry-otlp = "0.31.1"
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
metrics = "0.24.3"
metrics-exporter-prometheus = "0.18.1"
config = "0.15.22"
surrealdb = { version = "3.0.5", features = ["kv-rocksdb"] }
jsonschema = { version = "0.45.0", default-features = false }
governor = { version = "0.10.4", features = ["std", "jitter", "quanta"] }
nonzero_ext = "0.3.0"

# Compiler pipeline (UAR-AGENT-MD → descriptor)
pulldown-cmark = "0.13.3"
sha2 = "0.11.0"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.10.0"
argon2 = "0.5"

# File processing (multimodal support)
thiserror = "2.0"
mime_guess = "2.0"
base64 = "0.22"

# Kreuzberg - document intelligence framework with Rust core
kreuzberg = "4.6"

# Worker pool for scalable document ingestion
# Dependency Upgrade Process:
#   1. Check upstream for the desired commit: git ls-remote <repo-url> HEAD
#   2. Update `rev` to the new SHA below
#   3. Run `cargo update -p <package>` to refresh Cargo.lock
#   4. Run `cargo build` to verify compilation
#   5. Run `cargo test` to verify no regressions
#   6. Commit Cargo.toml + Cargo.lock together
prometheus_parking_lot = { git = "https://github.com/Prometheus-AGS/prometheus-parking-lot-rs", rev = "32b481d6c5694545d35789894f6feecf5ac4ca3e", features = [
  "tokio-runtime",
] }
num_cpus = "1.16"

# Graph algorithms for community detection (Leiden)
petgraph = "0.8"
dirs = "6.0.0"

# Universal LLM client — 142+ providers, streaming, tool calling
liter-llm = { git = "https://github.com/GQAdonis/liter-llm.git", features = ["full"] }
secrecy = { version = "0.10", features = ["serde"] }

# Leptos SSR (minimal templating)


# Lints (M-STATIC-VERIFICATION)
[lints.rust]
missing_debug_implementations = "warn"
redundant_imports = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Restriction lints for better code quality
clone_on_ref_ptr = "warn"
empty_drop = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
undocumented_unsafe_blocks = "warn"

# Cargo lints (useful in crates.io-bound projects) are noisy for a reference repo.
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

# Allow some pedantic lints that are too noisy
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
