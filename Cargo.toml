[workspace]
members = [".", "tools/uar-jwt-proxy", "tools/mcp-server-fetch"]
exclude = [
  "crates/prometheus-skill-system",
  ".claude/worktrees",
  "vendor/git/prometheus-parking-lot-rs",
  "vendor/git/surreal-memory-server",
  "vendor/git/surreal-memory-server/crates/surreal-memory",
  "vendor/git/sycophancy-correction",
  "vendor/git/sycophancy-correction/crates/sycophancy-core",
  "vendor/git/liter-llm",
  "vendor/git/liter-llm/crates/liter-llm",
  "vendor/git/rust-mcp-filesystem",
  "src-tauri",
]
resolver = "2"

[package]
name = "universal-agent-runtime"
version = "1.0.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "universal-agent-runtime"
path = "src/main.rs"
required-features = ["server"]

[[bin]]
name = "uar-sidecar"
path = "src/bin/uar-sidecar.rs"
required-features = ["server"]

# Cargo AUTO-DISCOVERS src/bin/*.rs. Without these declarations both binaries
# build under every profile including `embedded-mobile`, where they have no
# business existing: stub-llm opens a TcpListener and test_db_setup needs
# PostgresProvider. Declaring them with required-features is what excludes
# them — an auto-discovered bin cannot be gated any other way.
[[bin]]
name = "stub-llm"
path = "src/bin/stub-llm.rs"
required-features = ["server"]

[[bin]]
name = "test_db_setup"
path = "src/bin/test_db_setup.rs"
required-features = ["server"]

# Cookbook examples live in docs/cookbook/runtime/ but are built as examples of
# the runtime crate so they share the workspace build cache.
[[example]]
name = "cookbook_01_start_server"
path = "docs/cookbook/runtime/src/bin/01_start_server.rs"
required-features = ["server"]

[[example]]
name = "cookbook_02_load_config"
path = "docs/cookbook/runtime/src/bin/02_load_config.rs"
required-features = ["server"]

[[example]]
name = "cookbook_03_mcp_tool_call"
path = "docs/cookbook/runtime/src/bin/03_mcp_tool_call.rs"
required-features = ["server"]

[[example]]
name = "cookbook_04_streaming_sse"
path = "docs/cookbook/runtime/src/bin/04_streaming_sse.rs"
required-features = ["server"]

# Gherkin/BDD suite (tests/bdd.rs) drives its own main() via the Cucumber
# runner instead of libtest's harness, so it needs harness = false — Cargo's
# default auto-discovered test target assumes libtest and fails to build
# otherwise ("main function present" conflict).
[[test]]
name = "bdd"
path = "tests/bdd.rs"
harness = false

# The gRPC integration suite imports the optional tonic transport directly.
# Keep it out of feature profiles that intentionally omit A2A networking;
# `server-full` includes this feature and remains the authoritative release run.
[[test]]
name = "test_a2a_grpc"
path = "tests/test_a2a_grpc.rs"
required-features = ["a2a-transport"]

# The embedding integration suite initializes the optional on-device model.
# Profiles without local inference must not execute it; `server-full` does.
[[test]]
name = "burn_embedding_test"
path = "tests/burn_embedding_test.rs"
required-features = ["local-models"]

# CH-20: Criterion benchmarks for the router/dialect/context hot path.
# harness = false because Criterion drives its own main().
[[bench]]
name = "hot_path"
path = "benches/hot_path.rs"
harness = false

[dev-dependencies]
anyhow = "1.0"
axum-test = "20.1.0"
cucumber = "0.23.0"
serial_test = "3.4.0"
tempfile = "3.27.0"
tokio = { version = "1.50.0", features = ["full", "test-util"] }
tower = { version = "0.5.2", features = ["util"] }

# Testing infrastructure dependencies
mockall = "0.15"
tokio-test = "0.4"
rustls = { version = "0.23.37", features = ["ring"] }
criterion = { version = "0.8.2", features = ["html_reports", "async_tokio"] }
proptest = "1.6"

[build-dependencies]
tonic-build = "0.14"
tonic-prost-build = "0.14"

[features]
## Default backend stack: SurrealDB embedded only (SurrealKV), no Postgres/SQLite.
## This keeps UAR self-contained and avoids the libsqlite3-sys version conflict
## that arises when downstream consumers (e.g. librefang) link rusqlite >= 0.33
## (libsqlite3-sys 0.37) while sqlx 0.8 transitively links libsqlite3-sys 0.30.
default = ["minimal"]

## Supported release products. Capability features remain additive.
minimal = ["server", "surreal-backend"]
server-full = ["minimal", "a2a-transport", "local-models", "cedar-governance", "response-quality", "document-intelligence", "telemetry", "api-docs", "admin-ui", "wasm-runtime"]
desktop-full = ["server-full", "tauri"]

## Transport-free library profile for Android/iOS and other embedding hosts.
## Persistence and inference are supplied through public traits, so this profile
## does not select a built-in database or remote LLM provider.
embedded-mobile = ["host-persistence"]

## A host supplies `Arc<dyn PersistenceLayer>` to `EmbeddedRuntimeBuilder`.
## This satisfies the persistence invariant without selecting a built-in store.
host-persistence = []

## HTTP/SSE/A2A endpoint surface and server composition root. Embedded hosts
## call the same runtime services directly and do not enable these transports.
server = [
  "dep:axum",
  "dep:axum-extra",
  "dep:tower",
  "dep:tower-http",
  "dep:utoipa",
]

## SurrealDB-only persistence + compiler storage + A2A registry. SurrealKV-backed,
## fully embedded — no external services required. Required for UAR to function
## at all when `postgres-backend` is disabled.
surreal-backend = ["dep:surrealdb"]

## Process-local, non-durable persistence for minimal deployments and tests.
## Do not use when state must survive process restart.
in-memory-backend = []

## Local response-quality detection and optional corrective pass.
response-quality = ["dep:sycophancy-core"]

## Build and serve the React administrative application.
admin-ui = []

## On-device BGE embedding inference from packaged ONNX assets.
local-models = ["dep:fastembed"]

## Local embedding inference via Candle (transformers/BERT/Jina).
candle-embeddings = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]

## Local PDF/Office/OCR/archive document extraction.
document-intelligence = ["dep:kreuzberg", "dep:lopdf"]

## Embedded Swagger UI. The OpenAPI JSON contract remains available without it.
api-docs = ["dep:utoipa-swagger-ui"]

## Cedar policy evaluation. Disabled builds retain risk approval but no policy files.
cedar-governance = ["dep:cedar-policy"]

## OTLP tracing and Prometheus metrics export.
telemetry = ["dep:tracing-opentelemetry", "dep:opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk", "dep:metrics", "dep:metrics-exporter-prometheus"]

## Reports every UarError to Sentry (src/uar/error.rs). Off by default; DSN
## configuration and Sentry project setup are operator work (see
## openspec/changes/central-uar-error-enum/proposal.md).
sentry = ["dep:sentry"]

## A2A JSON-RPC, discovery, and gRPC network transports. Internal A2A types and
## registry contracts remain available for compiler and graph integration.
a2a-transport = ["dep:tonic", "dep:tonic-prost", "dep:prost"]

## Optional Postgres/sqlx persistence + compiler storage + A2A registry. Pulls
## in `sqlx` (with the `postgres` driver) and `pgvector`. When OFF, all
## Postgres-specific code paths are excluded from the build and the resulting
## artifact does not link `libsqlite3-sys` from sqlx's transitive closure.
postgres-backend = ["sqlx", "dep:pgvector"]

## Toggles `#[derive(sqlx::FromRow)]` on shared schema types. Implied by
## `postgres-backend` so existing `#[cfg_attr(feature = "sqlx", ...)]` derives
## continue to work whenever the Postgres backend is enabled.
sqlx = ["dep:sqlx"]

tauri = []
wasm-runtime = ["dep:wasmtime", "dep:wasmtime-wasi"]
## HashiCorp Vault KV-v2 config source. Off by default; enables `vault://...` URLs.
vault = ["dep:vaultrs"]


[dependencies]
# Web framework
axum = { version = "0.8", optional = true, features = ["multipart"] }
tower-http = { version = "0.7.0", optional = true, features = [
  "fs",
  "cors",
  "trace",
  "timeout",
] }


# Async runtime
tokio = { version = "1", features = ["full", "process"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.147"

# gRPC (A2A v0.3 transport)
tonic = { version = "0.14", optional = true }
tonic-prost = { version = "0.14", optional = true }
prost = { version = "0.14", optional = true }

# Async utilities
futures = "0.3.32"
async-stream = "0.3"
async-trait = "0.1"

# Actor model
ractor = "0.15.12"

# Governance policy engine
cedar-policy = { version = "4.9.1", optional = true }

# Sycophancy detection and correction (runtime quality gate)
sycophancy-core = { path = "vendor/git/sycophancy-correction/crates/sycophancy-core", optional = true }

# Wasm runtime (feature-gated). Bumped from 41.0.3 (CH-security-deps):
# fixes 2 critical aarch64 Winch-backend sandbox-escape CVEs (need >=42.0.2/
# >=43.0.2) and a wasmtime-wasi path_open(TRUNCATE) permission bypass (needs
# >=44.0.2). Took latest (46.x) rather than the exact minimum patched version.
wasmtime = { version = "46", optional = true }
wasmtime-wasi = { version = "46", optional = true }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls-native-roots",
  "multipart",
] }

# MCP client + in-process server (memory MCP). Bumped from
# 085470025f6 to the rmcp-v1.8.0 tag (2026-07-04, uar-security-deps-and-hygiene):
# fixes GHSA-89vp-x53w-74fx, a DNS-rebinding vuln in the Streamable HTTP
# server transport (patched >=1.4.0) -- this project enables
# transport-streamable-http-server below, so it was directly exposed.
rmcp = { version = "=2.2.0", features = [
  "client",
  "server",
  "macros",
  "reqwest",
  "transport-child-process",
  "transport-io",
  "transport-streamable-http-client-reqwest",
  "transport-streamable-http-server",
  "transport-streamable-http-server-session",
] }

# FLOOR for a transitive dependency of rmcp, declared here because rmcp cannot
# be fixed from this repo.
#
# rmcp 2.2.0 declares `sse-stream = "^0.2"`, which is too loose DOWNWARD: it
# permits 0.2.0-0.2.3, none of which have `SseStream::from_bytes_stream` — a
# function rmcp calls. Any fresh resolution therefore picks a version that
# cannot compile, and the failure surfaces inside rmcp with no hint that the
# cause is a version range in someone else's manifest.
#
# This is a FLOOR, not a pin: "0.2.4" means ^0.2.4 (>=0.2.4, <0.3.0), so 0.2.5+
# remain available. Verified by building against 0.2.5 — it compiles. What the
# floor excludes is exactly the broken range, which is all it needs to do; it
# does not defend against some future 0.2.x removing the API again.
#
# The committed Cargo.lock is NOT sufficient on its own. A lockfile records a
# resolution; it does not constrain the next one. tools/surreal-memory-server
# demonstrates the difference: it has a committed lockfile and still fails
# `rm Cargo.lock && cargo check` for this exact reason.
sse-stream = "0.2.4"

# Memory system — surreal-memory library backed by embedded SurrealDB (SurrealKV).
#
# The optional palace graph extension is intentionally excluded: UAR has no
# integrated or certified palace APIs, and the extension introduces SQLite.
surreal-memory = { path = "vendor/git/surreal-memory-server/crates/surreal-memory", default-features = false }

# Utilities
url = "2.5.7"
uuid = { version = "1.21.0", features = ["v4", "serde"] }
dotenvy = "0.15.7"
clap = { version = "4.6.0", features = ["derive", "env"] }

# Performance (M-MIMALLOC-APPS)
mimalloc = "0.1"

# Observability (M-LOG-STRUCTURED)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Span-trace capture for UarError (src/uar/error.rs) — attaches the current
# tracing span chain to every error logged at the public API boundary.
tracing-error = "0.2"
anyhow = "1.0.100"
# Optional error reporting for UarError, gated behind the `sentry` feature
# (default off). Actual DSN/project configuration is operator work.
sentry = { version = "0.48", optional = true, default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
axum-extra = { version = "0.12.3", optional = true, features = [
  "typed-routing",
  "typed-header",
] }
tower = { version = "0.5.2", optional = true }
tokio-stream = { version = "0.1.17", features = ["net", "sync"] }
serde_norway = "0.9.42"
# Real local embedding inference (BGE-small-en-v1.5) — fix-embeddings-fastembed.
# Major-version 4 (not 5.x): surreal-memory → mempalace-core already depends on
# fastembed "4", and fastembed pins ort exactly per release — two fastembed
# majors would demand two conflicting `ort 2.0.0-rc.*` pins cargo cannot
# unify. default-features off on OUR edge: UAR loads the model + tokenizer
# shipped in src/uar/runtime/matching/models/ via try_new_from_user_defined —
# never hf-hub. (mempalace's default features still union `online` into the
# shared build; UAR's embedding path performs no runtime downloads.)
# ort-download-binaries fetches prebuilt ONNX Runtime at BUILD time only.
fastembed = { version = "5", optional = true, default-features = false, features = [
  "ort-download-binaries",
] }
# Local embedding inference via Candle (optional, gated by `candle-embeddings`).
candle-core = { version = "0.11.0", optional = true }
candle-nn = { version = "0.11.0", optional = true }
candle-transformers = { version = "0.9.2", optional = true }
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["onig"] }
tiktoken-rs = "0.12.0"
# Postgres stack — optional, gated by the `postgres-backend` feature. The empty
# `sqlx` feature flag (above) wires this dependency in for any code that needs
# `sqlx::FromRow` derives without enabling the full `postgres-backend` stack.
sqlx = { version = "0.8.6", default-features = false, optional = true, features = [
  "runtime-tokio-native-tls",
  "postgres",
  "macros",
  "uuid",
  "chrono",
  "json",
  "migrate",
] }
# Pinned to =0.4.1: its `sqlx` feature requires sqlx ^0.8, which unifies with
# our sqlx 0.8.6 pin. pgvector 0.4.2 widened to `>=0.8, <0.10`, causing cargo to
# resolve a second sqlx 0.9.0 whose Encode/Type impls don't match sqlx 0.8.6.
pgvector = { version = "=0.4.2", optional = true, features = ["sqlx"] }
text-splitter = "0.32.0"
chrono = { version = "0.4.44", features = ["serde"] }
walkdir = "2.5.0"
serde_yaml = "0.9"
jsonwebtoken = "10.2.0"
tracing-opentelemetry = { version = "0.33.0", optional = true }
opentelemetry = { version = "0.32.0", optional = true }
opentelemetry-otlp = { version = "0.32.0", optional = true }
opentelemetry_sdk = { version = "0.32.1", optional = true, features = ["rt-tokio"] }
metrics = { version = "0.24.3", optional = true }
metrics-exporter-prometheus = { version = "0.18.1", optional = true }
config = "0.15.22"
# JSON Schema generation for AppConfig, exposed at GET /.well-known/uar-config
# (openspec/changes/config-rs-schemars-migration).
schemars = "1"
# Lock-free runtime config hot-reload (openspec/changes/config-hot-reload-vault).
arc-swap = "1.6"
# Optional HashiCorp Vault KV-v2 source, gated behind the `vault` feature.
vaultrs = { version = "0.8", optional = true }
## Pinned to =3.2.0 (exact) so UAR, librefang, and surreal-memory all link
## the same SurrealDB client crate. See Phase 4b of the
## librefang `surrealdb-storage-swap` plan for the matching workspace pin.
## Bumped from =3.0.5 (uar-security-deps-and-hygiene, 2026-07-04): resolves
## every open surrealdb Dependabot alert (highest requirement was <3.1.5;
## 3.2.0 is the actual crates.io latest, chosen over the more conservative
## 3.1.5 dedicated security-patch release per explicit user direction).
## surreal-memory's own pin (surrealdb = "3.0.5", a caret range) is
## satisfied by 3.2.0 without needing a change in that repo.
surrealdb = { version = "=3.2.4", optional = true, features = ["kv-surrealkv"] }
jsonschema = { version = "0.48.1", default-features = false }
governor = { version = "0.10.4", features = ["std", "jitter", "quanta"] }
nonzero_ext = "0.3.0"

# Compiler pipeline (UAR-AGENT-MD → descriptor)
pulldown-cmark = "0.13.3"
sha2 = "0.11.0"
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
rand = "0.10.0"
argon2 = "0.5"

# File processing (multimodal support)
thiserror = "2.0"
mime_guess = "2.0"
base64 = "0.22"

# Credential encryption — AES-256-GCM for per-user provider API keys at rest
aes-gcm = "0.11"

# Kreuzberg - document intelligence framework with Rust core (v4 upstream)
# CLI install: cargo install --git https://github.com/kreuzberg-dev/kreuzberg --tag v4.9.8 kreuzberg-cli
# Or via Homebrew: brew tap kreuzberg-dev/tap && brew install kreuzberg-cli
# Prometheus-AGS fork of kreuzberg v4.9.9 + security bumps (lopdf 0.42,
# quick-xml 0.41, calamine 0.36, biblib 0.7) clearing RUSTSEC-2026-0187/0194/
# 0195 — upstream PR filed (kreuzberg-dev/kreuzberg); repoint at an upstream
# tag once it ships a release containing these bumps.
kreuzberg = { version = "=4.10.2", optional = true, default-features = false, features = [
    "tokio-runtime",        # extract_file_sync, batch_extract_file_sync
    "office",               # docx, odt, pptx, xlsx, odp, ods, etc. (replaces "formats")
    "excel",                # xlsx/xlsm/xls (replaces "formats")
    "email",                # .eml, .msg, .pst (replaces "formats")
    "html",                 # HTML-to-markdown (replaces "formats")
    "archives",             # zip, tar, 7z (replaces "formats")
    "ocr",                  # Tesseract OCR backend (replaces "analysis")
    "language-detection",   # whatlang language detection (replaces "analysis")
    "chunking",             # RAG text chunking via ChunkingConfig
    "mcp",                  # Embedded MCP server (kreuzberg mcp --transport stdio)
] }
lopdf = { version = "=0.44.0", optional = true, default-features = false }

# Worker pool for scalable document ingestion
# Dependency Upgrade Process:
#   1. Check upstream for the desired commit: git ls-remote <repo-url> HEAD
#   2. Update `rev` to the new SHA below
#   3. Run `cargo update -p <package>` to refresh Cargo.lock
#   4. Run `cargo build` to verify compilation
#   5. Run `cargo test` to verify no regressions
#   6. Commit Cargo.toml + Cargo.lock together
prometheus_parking_lot = { path = "vendor/git/prometheus-parking-lot-rs", features = [
  "tokio-runtime",
] }
num_cpus = "1.16"

# Graph algorithms for community detection (Leiden)
petgraph = "0.8"
dirs = "6.0.0"

# Filesystem watcher for skill hot-reload
notify = "8"

# Microsandbox — hardware VM isolation for sandboxed code execution (feature-gated)

# Universal LLM client — 142+ providers, streaming, tool calling
#
# Vendored as a git submodule (vendor/git/liter-llm, tracking GQAdonis/liter-llm)
# instead of the crates.io release so provider/streaming bugs can be fixed and
# consumed immediately without waiting on an upstream publish. See
# 2026-07-15 fix: ChatCompletionChunk.id (and object/created/model/choices)
# were non-optional, so any OpenAI-compatible backend that omits one of those
# fields on a chunk (many self-hosted/proxy backends do) hard-failed the
# entire stream with "missing field `id`".
liter-llm = { path = "vendor/git/liter-llm/crates/liter-llm", features = ["full"] }
secrecy = { version = "0.10", features = ["serde"] }

# OpenAPI / Swagger documentation
utoipa = { version = "5", optional = true, features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", optional = true, features = ["axum", "vendored"] }

# Leptos SSR (minimal templating)


# Lints (M-STATIC-VERIFICATION)
[lints.rust]
missing_debug_implementations = "warn"
redundant_imports = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Restriction lints for better code quality
clone_on_ref_ptr = "warn"
empty_drop = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
undocumented_unsafe_blocks = "warn"

# Cargo lints (useful in crates.io-bound projects) are noisy for a reference repo.
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

# Allow some pedantic lints that are too noisy
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Dev/test build speed. The dependency graph here (burn, cedar-policy,
# surrealdb, kreuzberg-tesseract, tokenizers, ...) produces very large debug
# binaries; full DWARF (debug=2) embedded in each of the ~50+ test binaries
# makes linking slow and memory-hungry (see .cargo/config.toml `jobs = 2`
# comment for the incident this was tuned against). `split-debuginfo =
# "unpacked"` keeps debug info out of the binary the linker has to produce;
# `debug = "line-tables-only"` keeps enough for `RUST_BACKTRACE` file:line
# without full variable/type DWARF. `cargo test`/`cargo build` (no --release)
# inherit these since `[profile.test]` defaults to `[profile.dev]`.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
