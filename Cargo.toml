[workspace]
members = [".", "tools/uar-jwt-proxy"]
exclude = ["crates/prometheus-skill-system", ".claude/worktrees"]
resolver = "2"

[package]
name = "universal-agent-runtime"
version = "1.0.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
path = "src/lib.rs"

[[bin]]
name = "universal-agent-runtime"
path = "src/main.rs"

[[bin]]
name = "uar-sidecar"
path = "src/bin/uar-sidecar.rs"

# Gherkin/BDD suite (tests/bdd.rs) drives its own main() via the Cucumber
# runner instead of libtest's harness, so it needs harness = false — Cargo's
# default auto-discovered test target assumes libtest and fails to build
# otherwise ("main function present" conflict).
[[test]]
name = "bdd"
path = "tests/bdd.rs"
harness = false

# CH-20: Criterion benchmarks for the router/dialect/context hot path.
# harness = false because Criterion drives its own main().
[[bench]]
name = "hot_path"
path = "benches/hot_path.rs"
harness = false

[dev-dependencies]
anyhow = "1.0"
axum-test = "19.1.1"
cucumber = "0.23.0"
serial_test = "3.4.0"
tempfile = "3.27.0"
tokio = { version = "1.50.0", features = ["full", "test-util"] }
tower = { version = "0.5.2", features = ["util"] }

# Testing infrastructure dependencies
mockall = "0.15"
tokio-test = "0.4"
rustls = { version = "0.23.37", features = ["ring"] }
criterion = { version = "0.8.2", features = ["html_reports", "async_tokio"] }

[build-dependencies]
burn-import = { version = "0.21.0", optional = true }
tonic-build = "0.14"
tonic-prost-build = "0.14"
ureq = "3.2.0"
serde_json = "1.0"
serde = { version = "1", features = ["derive"] }

[features]
## Default backend stack: SurrealDB embedded only (SurrealKV), no Postgres/SQLite.
## This keeps UAR self-contained and avoids the libsqlite3-sys version conflict
## that arises when downstream consumers (e.g. librefang) link rusqlite >= 0.33
## (libsqlite3-sys 0.37) while sqlx 0.8 transitively links libsqlite3-sys 0.30.
default = ["surreal-backend"]

## SurrealDB-only persistence + compiler storage + A2A registry. SurrealKV-backed,
## fully embedded — no external services required. Required for UAR to function
## at all when `postgres-backend` is disabled.
surreal-backend = []

## Optional Postgres/sqlx persistence + compiler storage + A2A registry. Pulls
## in `sqlx` (with the `postgres` driver) and `pgvector`. When OFF, all
## Postgres-specific code paths are excluded from the build and the resulting
## artifact does not link `libsqlite3-sys` from sqlx's transitive closure.
postgres-backend = ["sqlx", "dep:pgvector"]

## Toggles `#[derive(sqlx::FromRow)]` on shared schema types. Implied by
## `postgres-backend` so existing `#[cfg_attr(feature = "sqlx", ...)]` derives
## continue to work whenever the Postgres backend is enabled.
sqlx = ["dep:sqlx"]

## Enable the MemPalace knowledge-graph layer of `surreal-memory`. Off by
## default because it pulls in `mempalace-core` → `rusqlite` (bundled SQLite),
## which conflicts with newer `libsqlite3-sys` consumers. UAR itself does not
## reference any palace APIs today; opt in only if your application does.
memory-palace = ["surreal-memory/palace"]

model-build = ["dep:burn-import"]
tauri = []
wasm-runtime = ["dep:wasmtime", "dep:wasmtime-wasi"]


[dependencies]
# Web framework
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6.8", features = [
  "fs",
  "cors",
  "trace",
  "timeout",
] }


# Async runtime
tokio = { version = "1", features = ["full", "process"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.147"

# gRPC (A2A v0.3 transport)
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"

# Async utilities
futures = "0.3.32"
async-stream = "0.3"
async-trait = "0.1"

# Actor model
ractor = "0.15.12"

# Governance policy engine
cedar-policy = "4.9.1"

# Sycophancy detection and correction (runtime quality gate)
sycophancy-core = { git = "https://github.com/Know-Me-Tools/sycophancy-correction-skill.git", package = "sycophancy-core" }

# Wasm runtime (feature-gated). Bumped from 41.0.3 (CH-security-deps):
# fixes 2 critical aarch64 Winch-backend sandbox-escape CVEs (need >=42.0.2/
# >=43.0.2) and a wasmtime-wasi path_open(TRUNCATE) permission bypass (needs
# >=44.0.2). Took latest (46.x) rather than the exact minimum patched version.
wasmtime = { version = "46", optional = true }
wasmtime-wasi = { version = "46", optional = true }

# HTTP client
reqwest = { version = "0.12", features = [
  "json",
  "stream",
  "rustls-tls-native-roots",
  "multipart",
] }

# MCP client + in-process server (memory MCP). Bumped from
# 085470025f6 to the rmcp-v1.8.0 tag (2026-07-04, uar-security-deps-and-hygiene):
# fixes GHSA-89vp-x53w-74fx, a DNS-rebinding vuln in the Streamable HTTP
# server transport (patched >=1.4.0) -- this project enables
# transport-streamable-http-server below, so it was directly exposed.
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", rev = "26b65b6b88c5552447905923f683b6e4720a5600", features = [
  "client",
  "server",
  "macros",
  "reqwest",
  "transport-child-process",
  "transport-io",
  "transport-streamable-http-client-reqwest",
  "transport-streamable-http-server",
  "transport-streamable-http-server-session",
] }

# Memory system — surreal-memory library backed by embedded SurrealDB (SurrealKV).
#
# `palace` is intentionally NOT enabled by default because it pulls in
# `mempalace-core` → `rusqlite 0.31` (with `bundled`) → `libsqlite3-sys`,
# which conflicts with downstream consumers (e.g. librefang) that link a
# newer `rusqlite`/`libsqlite3-sys`. Opt in via the `memory-palace` feature
# below if you need the MemPalace knowledge-graph layer.
surreal-memory = { git = "https://github.com/Prometheus-AGS/surreal-memory-server.git", rev = "f9ab1c29944b86d44c23ea0e6192fa3d39acbde8", package = "surreal-memory", default-features = false }

# Utilities
url = "2.5.7"
uuid = { version = "1.21.0", features = ["v4", "serde"] }
dotenvy = "0.15.7"
clap = { version = "4.6.0", features = ["derive", "env"] }

# Performance (M-MIMALLOC-APPS)
mimalloc = "0.1"

# Observability (M-LOG-STRUCTURED)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0.100"
axum-extra = { version = "0.12.3", features = [
  "typed-routing",
  "typed-header",
] }
tower = "0.5.2"
tokio-stream = { version = "0.1.17", features = ["net", "sync"] }
serde_norway = "0.9.42"
burn = { version = "0.20.1", default-features = false, features = [
  "wgpu",
  "train",
  "ndarray",
] }
tokenizers = { version = "0.23.1", default-features = false, features = [
  "onig",
  "esaxx_fast",
] }
# Real local embedding inference (BGE-small-en-v1.5) — fix-embeddings-fastembed.
# Major-version 4 (not 5.x): surreal-memory → mempalace-core already depends on
# fastembed "4", and fastembed pins ort exactly per release — two fastembed
# majors would demand two conflicting `ort 2.0.0-rc.*` pins cargo cannot
# unify. default-features off on OUR edge: UAR loads the model + tokenizer
# shipped in src/uar/runtime/matching/models/ via try_new_from_user_defined —
# never hf-hub. (mempalace's default features still union `online` into the
# shared build; UAR's embedding path performs no runtime downloads.)
# ort-download-binaries fetches prebuilt ONNX Runtime at BUILD time only.
fastembed = { version = "4", default-features = false, features = [
  "ort-download-binaries",
] }
tiktoken-rs = "0.12.0"
# Postgres stack — optional, gated by the `postgres-backend` feature. The empty
# `sqlx` feature flag (above) wires this dependency in for any code that needs
# `sqlx::FromRow` derives without enabling the full `postgres-backend` stack.
sqlx = { version = "0.8.6", default-features = false, optional = true, features = [
  "runtime-tokio-native-tls",
  "postgres",
  "macros",
  "uuid",
  "chrono",
  "json",
  "migrate",
] }
# Pinned to =0.4.1: its `sqlx` feature requires sqlx ^0.8, which unifies with
# our sqlx 0.8.6 pin. pgvector 0.4.2 widened to `>=0.8, <0.10`, causing cargo to
# resolve a second sqlx 0.9.0 whose Encode/Type impls don't match sqlx 0.8.6.
pgvector = { version = "=0.4.2", optional = true, features = ["sqlx"] }
text-splitter = "0.29.3"
chrono = { version = "0.4.44", features = ["serde"] }
walkdir = "2.5.0"
serde_yaml = "0.9"
jsonwebtoken = "10.2.0"
tracing-opentelemetry = "0.33.0"
opentelemetry = "0.32.0"
opentelemetry-otlp = "0.32.0"
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
metrics = "0.24.3"
metrics-exporter-prometheus = "0.18.1"
config = "0.15.22"
## Pinned to =3.2.0 (exact) so UAR, librefang, and surreal-memory all link
## the same SurrealDB client crate. See Phase 4b of the
## librefang `surrealdb-storage-swap` plan for the matching workspace pin.
## Bumped from =3.0.5 (uar-security-deps-and-hygiene, 2026-07-04): resolves
## every open surrealdb Dependabot alert (highest requirement was <3.1.5;
## 3.2.0 is the actual crates.io latest, chosen over the more conservative
## 3.1.5 dedicated security-patch release per explicit user direction).
## surreal-memory's own pin (surrealdb = "3.0.5", a caret range) is
## satisfied by 3.2.0 without needing a change in that repo.
surrealdb = { version = "=3.2.1", features = ["kv-surrealkv"] }
jsonschema = { version = "0.46.10", default-features = false }
governor = { version = "0.10.4", features = ["std", "jitter", "quanta"] }
nonzero_ext = "0.3.0"

# Compiler pipeline (UAR-AGENT-MD → descriptor)
pulldown-cmark = "0.13.3"
sha2 = "0.11.0"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.10.0"
argon2 = "0.5"

# File processing (multimodal support)
thiserror = "2.0"
mime_guess = "2.0"
base64 = "0.22"

# Credential encryption — AES-256-GCM for per-user provider API keys at rest
aes-gcm = "0.10"

# Kreuzberg - document intelligence framework with Rust core (v4 upstream)
# CLI install: cargo install --git https://github.com/kreuzberg-dev/kreuzberg --tag v4.9.8 kreuzberg-cli
# Or via Homebrew: brew tap kreuzberg-dev/tap && brew install kreuzberg-cli
# Prometheus-AGS fork of kreuzberg v4.9.9 + security bumps (lopdf 0.42,
# quick-xml 0.41, calamine 0.36, biblib 0.7) clearing RUSTSEC-2026-0187/0194/
# 0195 — upstream PR filed (kreuzberg-dev/kreuzberg); repoint at an upstream
# tag once it ships a release containing these bumps.
kreuzberg = { git = "https://github.com/Prometheus-AGS/xberg.git", rev = "fbea152d4735dd817fc353f7eb5c359f798579f0", default-features = false, features = [
    "tokio-runtime",        # extract_file_sync, batch_extract_file_sync
    "pdf",                  # PDF extraction via pdf_oxide (replaces "formats")
    "office",               # docx, odt, pptx, xlsx, odp, ods, etc. (replaces "formats")
    "excel",                # xlsx/xlsm/xls (replaces "formats")
    "email",                # .eml, .msg, .pst (replaces "formats")
    "html",                 # HTML-to-markdown (replaces "formats")
    "archives",             # zip, tar, 7z (replaces "formats")
    "ocr",                  # Tesseract OCR backend (replaces "analysis")
    "language-detection",   # whatlang language detection (replaces "analysis")
    "chunking",             # RAG text chunking via ChunkingConfig
    "mcp",                  # Embedded MCP server (kreuzberg mcp --transport stdio)
] }

# Worker pool for scalable document ingestion
# Dependency Upgrade Process:
#   1. Check upstream for the desired commit: git ls-remote <repo-url> HEAD
#   2. Update `rev` to the new SHA below
#   3. Run `cargo update -p <package>` to refresh Cargo.lock
#   4. Run `cargo build` to verify compilation
#   5. Run `cargo test` to verify no regressions
#   6. Commit Cargo.toml + Cargo.lock together
prometheus_parking_lot = { git = "https://github.com/Prometheus-AGS/prometheus-parking-lot-rs", rev = "ebb7c3ce02f7b925bc2e1b45c87ce8abf402b1f0", features = [
  "tokio-runtime",
] }
num_cpus = "1.16"

# Graph algorithms for community detection (Leiden)
petgraph = "0.8"
dirs = "6.0.0"

# Filesystem watcher for skill hot-reload
notify = "8"

# Microsandbox — hardware VM isolation for sandboxed code execution (feature-gated)

# Universal LLM client — 142+ providers, streaming, tool calling
liter-llm = { git = "https://github.com/GQAdonis/liter-llm.git", rev = "d8223de3e07615c899b2658309d15d01c242940b", features = ["full"] }
secrecy = { version = "0.10", features = ["serde"] }

# OpenAPI / Swagger documentation
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Leptos SSR (minimal templating)


# Lints (M-STATIC-VERIFICATION)
[lints.rust]
missing_debug_implementations = "warn"
redundant_imports = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Restriction lints for better code quality
clone_on_ref_ptr = "warn"
empty_drop = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
undocumented_unsafe_blocks = "warn"

# Cargo lints (useful in crates.io-bound projects) are noisy for a reference repo.
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

# Allow some pedantic lints that are too noisy
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Dev/test build speed. The dependency graph here (burn, cedar-policy,
# surrealdb, kreuzberg-tesseract, tokenizers, ...) produces very large debug
# binaries; full DWARF (debug=2) embedded in each of the ~50+ test binaries
# makes linking slow and memory-hungry (see .cargo/config.toml `jobs = 2`
# comment for the incident this was tuned against). `split-debuginfo =
# "unpacked"` keeps debug info out of the binary the linker has to produce;
# `debug = "line-tables-only"` keeps enough for `RUST_BACKTRACE` file:line
# without full variable/type DWARF. `cargo test`/`cargo build` (no --release)
# inherit these since `[profile.test]` defaults to `[profile.dev]`.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
