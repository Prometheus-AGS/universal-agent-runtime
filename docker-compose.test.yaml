services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SKIP_MODEL_BUILD: "1"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/uar_test
      - SURREAL_URL=ws://surreal:8000/rpc
      - REDIS_URL=redis://redis:6379
      # Persistence
      - UAR_PERSISTENCE__PROVIDER=postgres
      - UAR_PERSISTENCE__DATABASE_URL=postgres://postgres:postgres@postgres:5432/uar_test
      # Server port (test uses 3001 to avoid conflicts)
      - UAR_SERVER__PORT=3001
      # LLM (stub values for tests — real requests should be mocked)
      - LLM_PROTOCOL=auto
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com}
      - LLM_API_KEY=${LLM_API_KEY:-test-key}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      # File processing
      - UAR_FILE_PROCESSING__UNSTRUCTURED__API_URL=http://unstructured:8000/general/v0/general
      - UAR_FILE_PROCESSING__UNSTRUCTURED__API_KEY=test_key
      # Test flags
      - TEST_MODE=true
      - COVERAGE=true
      - RUST_LOG=info
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      surreal:
        condition: service_healthy
      redis:
        condition: service_healthy
      unstructured:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - uar-test-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '1.0'

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=uar_test
      - POSTGRES_INITDB_ARGS=--auth-host=trust
    ports:
      - "5431:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uar_test"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - uar-test-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  surreal:
    image: surrealdb/surrealdb:latest
    command: start --log warn --user root --pass root --bind 0.0.0.0:8000 memory
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - uar-test-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  redis:
    image: redis/redis-stack:latest
    ports:
      - "6378:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - uar-test-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  unstructured:
    image: downloads.unstructured.io/unstructured-io/unstructured-api:latest
    platform: linux/amd64
    ports:
      - "8000:8000"
    environment:
      - UNSTRUCTURED_API_KEY=test_key
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - uar-test-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Test utilities and monitoring
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
      args:
        SKIP_MODEL_BUILD: "1"
    environment:
      - TEST_CONFIG=/config/config.test.yaml
      - RUST_LOG=debug
      - COVERAGE=true
    volumes:
      - ./config.test.yaml:/config/config.test.yaml:ro
      - ./tests:/tests:ro
      - test-results:/test-results
      - test-coverage:/coverage
    depends_on:
      app:
        condition: service_healthy
    networks:
      - uar-test-net
    profiles:
      - test
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

networks:
  uar-test-net:
    driver: bridge

volumes:
  test-results:
    driver: local
  test-coverage:
    driver: local
