# =============================================================================
# UAR — Remote SurrealDB (server / cloud)
# =============================================================================
# Use when SurrealDB runs as a separate process (Docker, Kubernetes, Surreal Cloud).
# Set credentials via environment (recommended) or uncomment below for local dev only.
#
#   export UAR_PERSISTENCE__DATABASE_URL="http://127.0.0.1:8000"
#   export UAR_PERSISTENCE__SURREAL_USER="root"
#   export UAR_PERSISTENCE__SURREAL_PASS="root"
#   CONFIG_FILE=config.remote.surreal.yaml cargo run --bin universal-agent-runtime
#
# URL forms: `http://host:port`, `https://host`, `ws://host/rpc`, `wss://host/rpc`
# Match `vector_dimension` to your embedding model (384 for bge-small, 1536 for text-embedding-3-small).
# =============================================================================

server:
  port: 1906
  host: "0.0.0.0"

security:
  jwt_required: true
  jwt_secret: "change_me_use_UAR_SECURITY__JWT_SECRET_in_production"

resilience:
  rate_limit_enabled: true
  timeout_disabled: false
  requests_per_second: 20.0
  burst_size: 40.0

persistence:
  provider: "surreal"
  # Override per environment — example local SurrealDB HTTP endpoint:
  database_url: "http://127.0.0.1:8000"
  vector_dimension: 384
  external_cache_enabled: false
  surreal_user: root
  surreal_pass: root

file_processing:
  provider: "auto"
  upload_dir: "/tmp/uar-uploads"
  max_files_per_prompt: 10
  max_file_size: 52428800
  max_total_size: 104857600

vision:
  auto_detect: true

knowledge_bases:
  named: {}

intent_classifier:
  backend: "tfidf"
  topk: 5
  accept_threshold: 0.5
  margin_threshold: 0.05

llm:
  model: "openai/gpt-4o"
  timeout_secs: 60
  max_retries: 3
  cost_tracking: false
  tracing: true

providers: []

failover:
  enabled: false
  strategy: "priority"

native_tools:
  file_tools_enabled: false
  file_allowed_paths: []
  web_fetch_enabled: false
  terminal_exec_enabled: false
  session_search_enabled: true

skill_evolution:
  enabled: false

acp:
  enabled: false
  path: "/acp"
  auth_required: true
  session_ttl_secs: 3600
