packages:
  - .
  - frontend
  - frontend/packages/*
  - frontend/packages/prometheus-entity-management/packages/*

overrides:
  esbuild: 0.28.1
  vite: 8.1.4
  'js-yaml@>=4.0.0 <4.3.0': 4.3.0
  'valibot@<=1.4.1': 1.4.2

onlyBuiltDependencies:
  - '@parcel/watcher'
  - better-sqlite3
  - esbuild
  - lefthook

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  lefthook: true
