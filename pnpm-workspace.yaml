packages:
  - .
  - frontend
  - frontend/packages/*
  - frontend/vendor/a2ui-markdown-it
  - frontend/vendor/a2ui-react-reference
  - frontend/vendor/a2ui-react-reference-legacy
  - frontend/vendor/a2ui-web-core
  - frontend/packages/prometheus-entity-management/packages/*
  # The published PEM renderer has its own workspace and lockfile.
  - '!frontend/packages/prometheus-entity-management/packages/a2ui-react'

verifyDepsBeforeRun: error

overrides:
  'dompurify@<3.4.17': 3.4.17
  esbuild: 0.28.1
  vite: 8.3.5
  'js-yaml@>=3.0.0 <4.0.0': 3.15.2
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'nanoid@>=3.0.0 <3.3.18': 3.3.18
  'valibot@<=1.4.1': 1.5.0
  '@sveltejs/vite-plugin-svelte@7.3.1>deepmerge': 'file:frontend/vendor/deepmerge-compat'
  '@ag-ui/core@1.0.3>zod': 4.6.7
  '@prometheus-ags/entity-graph-core@4.3.0>@ag-ui/core': 1.0.3
  '@prometheus-ags/entity-graph-react@4.3.0>@ag-ui/core': 1.0.3
  '@vitest/browser@4.1.10': 4.1.12
  '@vitest/browser-playwright@4.1.10': 4.1.12
  '@vitest/coverage-v8@4.1.10': 4.1.12
  '@vitest/mocker@4.1.10': 4.1.12
  '@vitest/ui@4.1.10': 4.1.12
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=4.0.0 <5.0.12': 5.0.12
  'devalue@<5.9.3': 5.9.3
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'katex@<0.18.2': 0.18.2
  'markdown-it@<14.3.3': 14.3.3
  'minimatch@>=7.0.0 <11.0.1': 11.0.1
  'postcss-selector-parser@<6.1.5': 6.1.5
  'seroval@<1.6.10': 1.6.10
  'seroval-plugins@<1.6.10': 1.6.10
  'storybook@>=10.0.0 <10.6.2': 10.6.5
  'undici@>=8.0.0 <8.12.2': 8.12.2
  'vitest@4.1.10': 4.1.12

minimumReleaseAgeExclude:
  - '@prometheus-ags/entity-graph-core@4.3.0'
  - '@prometheus-ags/entity-graph-react@4.3.0'
  - '@prometheus-ags/prometheus-entity-management@4.3.0'

onlyBuiltDependencies:
  - '@parcel/watcher'
  - better-sqlite3
  - esbuild
  - lefthook

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  lefthook: true
