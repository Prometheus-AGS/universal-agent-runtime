packages:
  - .
  - frontend
  - frontend/packages/*
  - frontend/packages/prometheus-entity-management/packages/*

overrides:
  'dompurify@<3.4.14': 3.4.14
  esbuild: 0.28.1
  vite: 8.1.4
  'js-yaml@>=3.0.0 <4.0.0': 3.15.1
  'js-yaml@>=4.0.0 <4.3.1': 4.3.1
  'nanoid@>=3.0.0 <3.3.18': 3.3.18
  'valibot@<=1.4.1': 1.4.2

minimumReleaseAgeExclude:
  - '@prometheus-ags/entity-graph-core@3.0.3'
  - '@prometheus-ags/prometheus-entity-management@3.0.3'

onlyBuiltDependencies:
  - '@parcel/watcher'
  - better-sqlite3
  - esbuild
  - lefthook

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  lefthook: true
