[package]
name = "uar-jwt-proxy"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Local dev reverse proxy that mints and injects an HS256 JWT for UAR."

[[bin]]
name = "uar-jwt-proxy"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["http2", "ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
http = "1"
dirs = "6"
