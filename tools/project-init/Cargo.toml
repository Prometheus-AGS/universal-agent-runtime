[package]
name = "project-init"
version = "1.0.0"
edition = "2024"
description = "Interactive TUI tool for initializing projects from the template"
authors = ["Developer <dev@example.com>"]
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "project-init"
path = "src/main.rs"

[dependencies]
# TUI prompts
inquire = "0.9"

# Terminal styling
console = "0.16"
indicatif = "0.18"

# File system operations
walkdir = "2.5"

# Pattern matching and replacement
regex = "1.13"

# Configuration parsing
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# Error handling
anyhow = "1.0"
thiserror = "2.0"
