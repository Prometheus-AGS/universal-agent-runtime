# systemd drop-in for uar-supervisor.service on the qualified Kubernetes node.
# The controller runs outside all UAR Pods. Keep its journal on host durable disk.
# Recovery stops and runtime-masks kubelet.service; node scheduling remains
# suspended until the operator resolves the old Pod and restores the unit.
[Service]
# Required only for the exact qualified node controller mechanism.
ProtectSystem=false
ProtectHome=yes
ReadWritePaths=/var/lib/uar-supervisor /sys/fs/cgroup
