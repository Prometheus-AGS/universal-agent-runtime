apiVersion: v1
kind: ServiceAccount
metadata:
  name: uar-supervisor
  namespace: uar
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uar-supervisor-pods
  namespace: uar
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uar-supervisor-pods
  namespace: uar
subjects:
  - kind: ServiceAccount
    name: uar-supervisor
    namespace: uar
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: uar-supervisor-pods
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: uar-supervisor-node-identity
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: uar-supervisor-node-identity
subjects:
  - kind: ServiceAccount
    name: uar-supervisor
    namespace: uar
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: uar-supervisor-node-identity
