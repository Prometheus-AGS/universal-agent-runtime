services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SKIP_MODEL_BUILD: "1"
    ports:
      - "${APP_PORT:-1906}:${UAR_SERVER__PORT:-1906}"
      - "50051:50051"
    environment:
      # Database
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/uar
      - SURREAL_URL=ws://surreal:8000/rpc
      - REDIS_URL=redis://redis:6379
      # Persistence
      - UAR_PERSISTENCE__PROVIDER=postgres
      - UAR_PERSISTENCE__DATABASE_URL=postgres://postgres:postgres@postgres:5432/uar
      - UAR_SERVER__PORT=${UAR_SERVER__PORT:-1906}
      # LLM (override via .env or shell env)
      - LLM_PROTOCOL=${LLM_PROTOCOL:-auto}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      # MCP tools
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      # Logging
      - RUST_LOG=debug
    depends_on:
      postgres:
        condition: service_healthy
      surreal:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:$${UAR_SERVER__PORT:-1906}/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - uar_data_dev:/data
    networks:
      - uar-network

  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=uar
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d uar" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - uar-network

  surreal:
    image: surrealdb/surrealdb:v3.2.4@sha256:51baed8709f57f67dcf04b30e3177db846803fa9342dae2be58c6fa5f8d59843
    ports:
      - "8000:8000"
    command: start --log trace --user root --pass root --bind 0.0.0.0:8000 file://data/surreal.db
    volumes:
      - surreal_data_dev:/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - uar-network

  redis:
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"
      - "8001:8001" # RedisInsight
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - uar-network

networks:
  uar-network:
    driver: bridge

volumes:
  uar_data_dev:
  postgres_data_dev:
  surreal_data_dev:
  redis_data_dev:
