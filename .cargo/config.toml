# Coverage instrumentation (`-C instrument-coverage`, `-C link-dead-code`) used
# to be forced on globally here via `[env]`/`[target.'cfg(test)']`, which meant
# EVERY local `cargo build`/`cargo test`/`cargo check` paid the coverage tax
# (bigger binaries, slower links, more link-time memory) for no benefit — only
# `tools/coverage.sh` and CI's coverage job actually need it, and both already
# `export RUSTFLAGS`/`CARGO_INCREMENTAL` themselves right before the
# coverage-instrumented run (see tools/coverage.sh:138-144, 170-176). Removed
# so day-to-day builds are fast; coverage runs are unaffected.

[build]
# Deliberately RELATIVE, so each git worktree gets its OWN target dir.
#
# A single shared absolute `CARGO_TARGET_DIR` looks appealing — one set of
# artifacts instead of N — but cargo takes an exclusive lock on a target dir,
# so it serializes every concurrent build across all worktrees. Sharing
# *compiled artifacts* is the job of `rustc-wrapper` below, which caches at the
# compiler level and needs no lock. (Cargo's own cross-workspace cache is a
# 2026 project goal, still nightly-only.)
target-dir = "target"

# sccache: the reason a second worktree does not recompile burn, cedar-policy,
# surrealdb and tokenizers from scratch. It was installed on this machine but
# never wired in, which is why five worktrees accumulated ~800MB of target/
# each while sharing nothing (measured hit rate before wiring: 19.6%).
rustc-wrapper = "sccache"

# Parallelism. The previous value (`2`) was set by 71751de for a "4-core/15GB
# box" — a DIFFERENT machine from the one this repo now lives on (10 cores /
# 64GB). It was throttling builds by 5x for an OOM risk that no longer exists.
# 6 leaves headroom for the several very large debug links in this graph
# rather than saturating all 10 cores. If `memory_pressure` drops below ~30%
# free during a build, lower this — the original OOM was real on its box.
jobs = 6
