# Coverage instrumentation (`-C instrument-coverage`, `-C link-dead-code`) used
# to be forced on globally here via `[env]`/`[target.'cfg(test)']`, which meant
# EVERY local `cargo build`/`cargo test`/`cargo check` paid the coverage tax
# (bigger binaries, slower links, more link-time memory) for no benefit — only
# `tools/coverage.sh` and CI's coverage job actually need it, and both already
# `export RUSTFLAGS`/`CARGO_INCREMENTAL` themselves right before the
# coverage-instrumented run (see tools/coverage.sh:138-144, 170-176). Removed
# so day-to-day builds are fast; coverage runs are unaffected.

[build]
# Deliberately RELATIVE, so each git worktree gets its OWN target dir.
#
# A single shared absolute `CARGO_TARGET_DIR` looks appealing — one set of
# artifacts instead of N — but cargo takes an exclusive lock on a target dir,
# so it serializes every concurrent build across all worktrees. Sharing
# *compiled artifacts* is `rustc-wrapper`'s job (sccache; see the note below
# for why it is configured per-machine rather than here), and it needs no
# lock. Cargo's own cross-workspace cache is a 2026 project goal, still
# nightly-only.
#
# Neither mechanism removes the remaining serialization point: concurrent
# builds still queue on the shared `~/.cargo/registry` package-cache lock.
target-dir = "target"

# NOTE: `rustc-wrapper = "sccache"` deliberately does NOT live here.
#
# This file is tracked, so every consumer of the repo — including CI — reads
# it, and cargo resolves the wrapper through PATH. No GitHub Actions workflow
# installs sccache, so setting it here fails every job with
# `could not execute process 'sccache …' (never executed)`. The same failure
# hits any local shell whose PATH lacks the binary; that is exactly how this
# was found (2026-08-08), by a build in a worktree without Homebrew on PATH.
#
# sccache is worth using — a warm rebuild on this machine went from 5 to 393
# Rust cache hits (1.51% -> 42.29%) — but it is a MACHINE choice, not a repo
# one. Enable it per-developer, outside version control:
#
#     # ~/.cargo/config.toml  (user-global, untracked)
#     [build]
#     rustc-wrapper = "/opt/homebrew/bin/sccache"   # absolute path, not PATH
#
# or per-shell with `RUSTC_WRAPPER=/opt/homebrew/bin/sccache`. Use an absolute
# path in either case: a bare name reintroduces the PATH dependency.
#
# To adopt it in CI, add a real install step (e.g. mozilla-actions/sccache-action)
# and set RUSTC_WRAPPER in that workflow's env — not here.

# NOTE: `jobs` deliberately does NOT live here either, for the same reason as
# the wrapper — it is a machine property, not a repo property.
#
# The previous value (`jobs = 2`, from 71751de) was chosen for what its own
# comment calls "this 4-core/15GB box". Repo config OUTRANKS `~/.cargo/config.toml`,
# so that line silently capped every developer and every CI runner at 2 jobs
# regardless of their hardware — including a 10-core machine whose user config
# already asked for 10.
#
# Set it per-machine instead:
#
#     # ~/.cargo/config.toml
#     [build]
#     jobs = 10
#
# or per-invocation with `--jobs N` / `CARGO_BUILD_JOBS`. Omitting it here lets
# cargo default to the core count, which is right for CI runners too.
#
# The original OOM was real on its box: if a build pages heavily, lower `jobs`
# in the machine config — this graph has several very large debug links
# (burn, cedar-policy, surrealdb, tokenizers).
