services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SKIP_MODEL_BUILD: "1"
    restart: always
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # Database
      - DATABASE_URL=${DATABASE_URL}
      - SURREAL_URL=${SURREAL_URL}
      - REDIS_URL=${REDIS_URL}
      # Persistence
      - UAR_PERSISTENCE__PROVIDER=${UAR_PERSISTENCE__PROVIDER:-postgres}
      - UAR_PERSISTENCE__DATABASE_URL=${DATABASE_URL}
      # LLM
      - LLM_PROTOCOL=${LLM_PROTOCOL:-auto}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      # MCP tools
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      # Logging
      - RUST_LOG=info
    depends_on:
      postgres:
        condition: service_healthy
      surreal:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - uar_data_prod:/data
    networks:
      - uar-prod-net

  postgres:
    image: pgvector/pgvector:pg17
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - uar-prod-net

  surreal:
    image: surrealdb/surrealdb:latest
    restart: always
    ports:
      - "${SURREAL_PORT:-8000}:8000"
    command: start --log info --user ${SURREAL_USER} --pass ${SURREAL_PASS} --bind 0.0.0.0:8000 file://data/surreal.db
    volumes:
      - surreal_data_prod:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - uar-prod-net

  redis:
    image: redis/redis-stack:latest
    restart: always
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - uar-prod-net

networks:
  uar-prod-net:
    driver: bridge

volumes:
  uar_data_prod:
  postgres_data_prod:
  surreal_data_prod:
  redis_data_prod:
