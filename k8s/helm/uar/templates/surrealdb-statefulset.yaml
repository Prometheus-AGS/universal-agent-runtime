{{- if .Values.surrealdb.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: surrealdb
  namespace: {{ include "uar.namespace" . }}
  labels:
    app.kubernetes.io/name: surrealdb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: universal-agent-runtime
spec:
  serviceName: surrealdb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: surrealdb
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: surrealdb
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: universal-agent-runtime
    spec:
      containers:
        - name: surrealdb
          image: "{{ .Values.surrealdb.image.repository }}:{{ .Values.surrealdb.image.tag }}"
          args:
            - start
            - --log
            - info
            - "rocksdb:/data/surreal.db"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: SURREAL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "uar.fullname" . }}-secrets
                  key: SURREAL_USER
            - name: SURREAL_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "uar.fullname" . }}-secrets
                  key: SURREAL_PASS
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.surrealdb.resources | nindent 12 }}
          volumeMounts:
            - name: surrealdb-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: surrealdb-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.storageClass.name }}
        resources:
          requests:
            storage: {{ .Values.surrealdb.storage.size }}
{{- end }}
