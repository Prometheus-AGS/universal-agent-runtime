apiVersion: v1
kind: Service
metadata:
  name: {{ include "uar.fullname" . }}
  namespace: {{ include "uar.namespace" . }}
  labels:
    {{- include "uar.appLabels" . | nindent 4 }}
spec:
  type: {{ .Values.uar.service.type }}
  selector:
    {{- include "uar.appSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.uar.service.port }}
      targetPort: http
      protocol: TCP
    - name: grpc
      port: {{ .Values.uar.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
