apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: uar
  namespace: uar
  labels:
    app.kubernetes.io/name: uar
    app.kubernetes.io/part-of: universal-agent-runtime
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: uar
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
