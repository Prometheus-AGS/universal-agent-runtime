apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: surrealdb
  namespace: uar
  labels:
    app.kubernetes.io/name: surrealdb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: universal-agent-runtime
spec:
  serviceName: surrealdb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: surrealdb
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: surrealdb
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: universal-agent-runtime
    spec:
      containers:
        - name: surrealdb
          image: surrealdb/surrealdb:v3.2.4@sha256:51baed8709f57f67dcf04b30e3177db846803fa9342dae2be58c6fa5f8d59843
          args:
            - start
            - --log
            - info
            - "rocksdb:/data/surreal.db"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: SURREAL_USER
              valueFrom:
                secretKeyRef:
                  name: uar-secrets
                  key: SURREAL_USER
            - name: SURREAL_PASS
              valueFrom:
                secretKeyRef:
                  name: uar-secrets
                  key: SURREAL_PASS
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: surrealdb-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: surrealdb-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: uar-immediate
        resources:
          requests:
            storage: 10Gi
