apiVersion: v1
kind: Secret
metadata:
  name: uar-secrets
  namespace: uar
  labels:
    app.kubernetes.io/name: uar
    app.kubernetes.io/part-of: universal-agent-runtime
type: Opaque
data:
  # Base64-encoded placeholder values — replace before deploying.
  # echo -n 'CHANGEME' | base64 -> Q0hBTkdFTUU=
  UAR_LLM__API_KEY: Q0hBTkdFTUU=
  UAR_SECURITY__JWT_SECRET: Q0hBTkdFTUU=
  POSTGRES_PASSWORD: Q0hBTkdFTUU=
  SURREAL_USER: cm9vdA==
  # echo -n 'root' | base64 -> cm9vdA==
  SURREAL_PASS: Q0hBTkdFTUU=
