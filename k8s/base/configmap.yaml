apiVersion: v1
kind: ConfigMap
metadata:
  name: uar-config
  namespace: uar
  labels:
    app.kubernetes.io/name: uar
    app.kubernetes.io/part-of: universal-agent-runtime
data:
  UAR_SERVER__PORT: "1906"
  UAR_SERVER__GRPC_PORT: "50051"
  UAR_SERVER__HOST: "0.0.0.0"
  UAR_SERVER__LOG_FORMAT: "json"
  UAR_SERVER__SHUTDOWN_TIMEOUT_SECS: "30"
  UAR_MEMORY__ENABLED: "true"
  UAR_MEMORY__SURREAL_ENDPOINT: "ws://surrealdb:8000"
  DATABASE_URL: "postgres://uar:CHANGEME@postgres:5432/uar"
  RUST_LOG: "info,universal_agent_runtime=debug"
