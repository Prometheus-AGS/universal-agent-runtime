apiVersion: apps/v1
kind: Deployment
metadata:
  name: uar
  namespace: uar
  labels:
    app.kubernetes.io/name: uar
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: universal-agent-runtime
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: uar
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uar
        app.kubernetes.io/component: app
        app.kubernetes.io/part-of: universal-agent-runtime
    spec:
      serviceAccountName: uar-app
      terminationGracePeriodSeconds: 60
      containers:
        - name: uar
          image: PLACEHOLDER_IMAGE
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
          envFrom:
            - configMapRef:
                name: uar-config
            - secretRef:
                name: uar-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: skills
              mountPath: /app/skills
      volumes:
        - name: data
          emptyDir: {}
        - name: skills
          emptyDir: {}
