[package]
name = "uar-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
serde = "1"
jsonschema = "0.49.4"

[dependencies.universal-agent-runtime]
path = ".."
default-features = false
features = ["minimal"]

[[bin]]
name = "chunker"
path = "fuzz_targets/chunker.rs"
test = false
doc = false

[[bin]]
name = "rag_verification"
path = "fuzz_targets/rag_verification.rs"
test = false
doc = false

[[bin]]
name = "mcp_message_parser"
path = "fuzz_targets/mcp_message_parser.rs"
test = false
doc = false

[[bin]]
name = "json_schema_validator"
path = "fuzz_targets/json_schema_validator.rs"
test = false
doc = false

[patch.crates-io]
tokenizers-v022 = { package = "tokenizers", path = "../vendor/patches/tokenizers-0.22.2" }
tokenizers-v023 = { package = "tokenizers", path = "../vendor/patches/tokenizers-0.23.2" }
gemm = { path = "../vendor/patches/gemm-0.19.0" }
gemm-c32 = { path = "../vendor/patches/gemm-c32-0.19.0" }
gemm-c64 = { path = "../vendor/patches/gemm-c64-0.19.0" }
gemm-common = { path = "../vendor/patches/gemm-common-0.19.0" }
gemm-f16 = { path = "../vendor/patches/gemm-f16-0.19.0" }
gemm-f32 = { path = "../vendor/patches/gemm-f32-0.19.0" }
gemm-f64 = { path = "../vendor/patches/gemm-f64-0.19.0" }
pulp = { path = "../vendor/patches/pulp-0.22.3" }
heapless = { path = "../vendor/patches/heapless-0.7.17" }
indicatif = { path = "../vendor/patches/indicatif-0.17.11" }
surrealmx = { path = "../vendor/patches/surrealmx-1.1.0" }
wasmtimer = { path = "../vendor/patches/wasmtimer-0.4.3" }
# Independent workspaces do not inherit the runtime lifecycle overlays.
surrealdb = { path = "../vendor/patches/surrealdb-lifecycle/surrealdb-4.0.0" }
surrealdb-core = { path = "../vendor/patches/surrealdb-lifecycle/surrealdb-core-4.0.0" }
surrealdb-engine-local = { path = "../vendor/patches/surrealdb-lifecycle/surrealdb-engine-local-4.0.0" }
surrealdb-kvs-surrealkv = { path = "../vendor/patches/surrealdb-lifecycle/surrealdb-kvs-surrealkv-4.0.0" }
# Independent lockfiles also use the runtime RustCrypto backports.
jsonwebtoken-v10 = { package = "jsonwebtoken", path = "../vendor/patches/jwt-rustcrypto/jsonwebtoken-10.4.0" }
jsonwebtoken-v11 = { package = "jsonwebtoken", path = "../vendor/patches/jwt-rustcrypto/jsonwebtoken-11.1.0" }
