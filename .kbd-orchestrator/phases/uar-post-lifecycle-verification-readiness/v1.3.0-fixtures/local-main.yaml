# PROPOSED isolated fixture only. Gate CLOSED. No operator configuration is used.
# Public synthetic fixture credentials below convey no existing authority.
server:
  host: "127.0.0.1"
  port: 49310
  grpc_port: 49313
  cors_allowed_origins: []
  mcp_shared_transports_enabled: false
  ingest_directory: "target/uar-post-lifecycle-v130-001/ingest"
security:
  deployment_profile: trusted_local
  jwt_required: true
  jwt_algorithm: HS256
  jwt_secret: "synthetic-policy-scenario"
  jwt_issuer: "uar-client-tools-local-gate"
  jwt_audience: "uar-client-tools-candidate"
  jwt_validate_nbf: true
  settings_mutation_auth_required: true
  settings_admin_key: "uar-post-lifecycle-v130-001-public-fixture-admin"
  trusted_host_principals:
    - issuer: "uar-client-tools-local-gate"
      subject: "uar-post-lifecycle-host"
      tenant_id: "client-tools-local-tenant"
      host_id: "uar-post-lifecycle-v130-001-host"
persistence:
  provider: surreal
  database_url: "ws://127.0.0.1:49312"
  surreal_ns: "uar_post_lifecycle_v130_001"
  surreal_db: "uar_post_lifecycle_v130_001"
  surreal_user: "root"
  surreal_pass: "uar-post-lifecycle-v130-001-public-fixture-store"
  vector_dimension: 384
  external_cache_enabled: false
memory:
  enabled: false
  db_path: "target/uar-post-lifecycle-v130-001/memory.db"
llm:
  model: "fixture/gpt-4o-mini"
  base_url: "http://127.0.0.1:49311/v1"
  api_key: "local-fixture-only"
  protocol: chat
  max_retries: 0
  timeout_secs: 90
  embedding:
    backend: openai
    model: "text-embedding-3-small"
    base_url: "http://127.0.0.1:49311/v1"
    api_key: "local-fixture-only"
    vector_dimension: 384
    models_dir: "target/uar-post-lifecycle-v130-001/models"
providers:
  - id: fixture
    display_name: "Isolated post-lifecycle loopback fixture"
    base_url: "http://127.0.0.1:49311/v1"
    protocol: chat
    api_key: "local-fixture-only"
    default_model: "gpt-4o-mini"
    enabled: true
    models:
      - id: "gpt-4o-mini"
        pricing_identity:
          provider_id: openai
          model_id: "gpt-4o-mini"
        supports_tools: true
        supports_streaming: true
        enabled: true
native_tools:
  file_tools_enabled: false
  web_fetch_enabled: false
  terminal_exec_enabled: false
  session_search_enabled: false
acp:
  enabled: true
  path: "/acp"
  auth_required: true
resilience:
  rate_limit_enabled: true
  requests_per_second: 200.0
  burst_size: 400.0
