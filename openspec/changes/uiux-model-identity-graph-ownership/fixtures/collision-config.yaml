# Frozen fixture for SCN-IDN-001, SCN-IDN-002 and SCN-IDN-003 (written 2026-11-19).
# Two custom providers, absent from the bundled catalog, list the SAME bare model id.
# A third entry uses a model id that contains a slash. /api/models merges configured
# providers' models into its payload (src/server.rs:4011-4057), so these become
# catalog-slice rows next to the 8,170 bundled (provider, model) pairs.
#
# Expected rows are frozen in catalog-identity.json under customProviderCollisionConfig.
# The base URL points at the repository stub model server (target/debug/stub-llm,
# STUB_LLM_PORT, as frontend/playwright.real-server.config.ts starts it); no model call is made.
#
# How the boundary runner loads this file as the scratch config is UNVERIFIED here;
# the lead binds the exact argv (the real-server config sets UAR_* env, not a config path).
providers:
  - id: "idn-gw-a"
    display_name: "IDN Gateway A"
    base_url: "http://127.0.0.1:4601/v1"
    protocol: chat
    enabled: true
    default_model: "idn-shared-model"
    models:
      - id: "idn-shared-model"
        context_window: 64000
        supports_vision: true
        supports_tools: true
      - id: "idn-org/slash-model"
        context_window: 16000
        supports_vision: false
        supports_tools: true
  - id: "idn-gw-b"
    display_name: "IDN Gateway B"
    base_url: "http://127.0.0.1:4601/v1"
    protocol: chat
    enabled: true
    default_model: "idn-shared-model"
    models:
      - id: "idn-shared-model"
        context_window: 32000
        supports_vision: false
        supports_tools: false
