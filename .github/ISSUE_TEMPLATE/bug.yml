name: Bug report
description: Something doesn't work as documented
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: UAR version / commit
      placeholder: "v1.0.0 or commit SHA"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Configure ...
        2. Call ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: "OS, deployment method (compose/binary/k8s), provider/model config"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: JSON logs around the failure. Redact secrets and API keys.
      render: text
