name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "sdks/**"
      - "src/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/stage-documentation-references.mjs"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Assemble Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            sdks/typescript/package-lock.json

      - name: Install portal dependencies
        run: npm --prefix website ci

      - name: Build Docusaurus portal
        run: npm --prefix website run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Generate Rust reference
        run: cargo doc --locked --no-deps --workspace --features server-full

      - name: Install TypeScript SDK dependencies
        run: npm --prefix sdks/typescript ci

      - name: Generate TypeScript reference
        run: npm --prefix sdks/typescript run docs

      - name: Stage generated references
        run: node scripts/stage-documentation-references.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    name: Deploy and validate Pages artifact
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Validate deployed documentation routes
        shell: bash
        run: |
          BASE_URL="${{ steps.deployment.outputs.page_url }}"
          for route in \
            "" \
            "docs/architecture/intro" \
            "docs/api/rust/" \
            "docs/api/typescript/"
          do
            URL="${BASE_URL%/}/${route}"
            echo "Checking ${URL}"
            curl --fail --silent --show-error --location \
              --retry 6 --retry-all-errors --retry-delay 10 \
              --output /dev/null "${URL}"
          done
