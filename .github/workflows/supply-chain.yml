name: Supply-chain release evidence

on:
  push:
    branches:
      - production-release
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed GitHub release tag
        required: true
        type: string
      test_run_url:
        description: Successful consolidated-test run URL for this exact source commit
        required: true
        type: string
      security_audit_run_url:
        description: Successful security-audit run URL for this exact source commit
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  preflight:
    name: Validate supply-chain contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Complete recursive submodule checkout
        shell: bash
        run: bash scripts/update-submodules.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate workflow, schema, and generators
        run: |
          node scripts/validate-supply-chain.mjs
          node --check scripts/generate-release-manifest.mjs
          node --check scripts/validate-release-manifest.mjs

  artifacts-and-image:
    name: Generate signed evidence
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      source_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Resolve release source commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          TEST_RUN_URL: ${{ inputs.test_run_url }}
          SECURITY_AUDIT_RUN_URL: ${{ inputs.security_audit_run_url }}
        run: |
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha)"
          object_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.type)"
          if [ "$object_type" = tag ]; then
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq .object.sha)"
          fi
          test "$(printf '%s' "$sha" | grep -Ec '^[0-9a-f]{40}$')" -eq 1
          case "$RELEASE_TAG" in
            v*.*.*-rc.*) ga_tag="${RELEASE_TAG%%-rc.*}" ;;
            *) echo "supply-chain publication requires an immutable release-candidate tag" >&2; exit 1 ;;
          esac
          existing_ga="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${ga_tag}" --jq '[.object.sha,.object.type] | @tsv' 2>/dev/null || true)"
          if [ -n "$existing_ga" ]; then
            existing_ga_sha="${existing_ga%%[[:space:]]*}"
            existing_ga_type="${existing_ga##*[[:space:]]}"
            if [ "$existing_ga_type" = tag ]; then
              existing_ga_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${existing_ga_sha}" --jq .object.sha)"
            fi
          else
            existing_ga_sha=null
          fi
          for run_contract in \
            "$TEST_RUN_URL|.github/workflows/ci.yml" \
            "$SECURITY_AUDIT_RUN_URL|.github/workflows/security-audit.yml"; do
            run_url="${run_contract%%|*}"
            expected_path="${run_contract#*|}"
            case "$run_url" in
              "https://github.com/${GITHUB_REPOSITORY}/actions/runs/"[0-9]*) ;;
              *) echo "evidence URL is not an immutable run in this repository: $run_url" >&2; exit 1 ;;
            esac
            run_id="${run_url##*/}"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .head_sha)" = "$sha"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status)" = completed
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .conclusion)" = success
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .path)" = "$expected_path"
          done
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ga_tag=$ga_tag" >> "$GITHUB_OUTPUT"
          echo "existing_ga_sha=$existing_ga_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 1
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Complete recursive submodule checkout
        shell: bash
        run: bash scripts/update-submodules.sh

      - name: Download release payloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence
          gh release download "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --dir evidence --pattern '*.tar.gz' --pattern '*.zip'
          find evidence -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | grep -q .

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image reference
        id: image
        run: echo "image=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-architecture image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.image }}:${{ inputs.tag }}
          provenance: mode=max
          sbom: true

      - name: Verify image executes without root
        run: |
          docker pull "${{ steps.image.outputs.image }}@${{ steps.build.outputs.digest }}"
          docker run --rm --platform linux/amd64 --user 65532:65532 --entrypoint sh \
            "${{ steps.image.outputs.image }}@${{ steps.build.outputs.digest }}" \
            -c 'test "$(id -u)" -ne 0 && universal-agent-runtime --version'

      - uses: anchore/sbom-action/download-syft@v0
      - name: Generate CycloneDX and SPDX SBOMs
        run: |
          for artifact in evidence/*.tar.gz evidence/*.zip; do
            rm -rf archive-input
            mkdir archive-input
            case "$artifact" in
              *.zip) unzip -q "$artifact" -d archive-input ;;
              *) tar -xzf "$artifact" -C archive-input ;;
            esac
            syft dir:archive-input \
              -o "cyclonedx-json=${artifact}.cyclonedx.json" \
              -o "spdx-json=${artifact}.spdx.json"
            if [ "$(basename "$artifact")" = uar-offline-source.tar.gz ]; then
              continue
            fi
            case "$artifact" in
              *.zip)
                binary="$(find archive-input -type f -name universal-agent-runtime.exe -print)"
                ;;
              *)
                binary="$(find archive-input -type f -name universal-agent-runtime -print)"
                ;;
            esac
            test "$(printf '%s\n' "$binary" | grep -c .)" -eq 1
            syft "file:${binary}" -o "cyclonedx-json=${artifact}.binary.cyclonedx.json" -o "spdx-json=${artifact}.binary.spdx.json"
          done
          rm -rf archive-input
          syft dir:. --exclude evidence \
            -o cyclonedx-json=evidence/source.cyclonedx.json \
            -o spdx-json=evidence/source.spdx.json
          syft "${{ steps.image.outputs.image }}@${{ steps.build.outputs.digest }}" \
            -o cyclonedx-json=evidence/image.cyclonedx.json -o spdx-json=evidence/image.spdx.json

      # First-party SBOM attestation (openspec/changes/slsa-l3-osv-grype-security-txt):
      # binds a generated SBOM to its real artifact via GitHub's native
      # attestation API, separate from the payload/checksum provenance attested
      # below. actions/attest-sbom takes exactly one subject per call (either
      # subject-path, or subject-name+subject-digest for an OCI image) — it
      # cannot batch multiple subjects, so this attests the two canonical
      # artifacts (the Linux x64 release tarball and the container image)
      # against their own already-generated per-artifact SBOMs. Attesting every
      # per-platform tarball too is a straightforward follow-up: repeat the
      # "Attest Linux x64 tarball SBOM" step with a different `find` pattern.
      - name: Locate the Linux x64 release tarball
        id: linux_tarball
        run: |
          artifact="$(find evidence -maxdepth 1 -name '*linux-x64.tar.gz' -print -quit)"
          test -n "$artifact"
          echo "path=$artifact" >> "$GITHUB_OUTPUT"

      - name: Attest Linux x64 tarball SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-path: ${{ steps.linux_tarball.outputs.path }}
          sbom-path: ${{ steps.linux_tarball.outputs.path }}.cyclonedx.json
          push-to-registry: false

      - name: Attest image SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: evidence/image.cyclonedx.json
          push-to-registry: false

      - name: Create provenance input checksums
        working-directory: evidence
        run: sha256sum *.tar.gz *.zip > PAYLOAD_SHA256SUMS

      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign payloads and image keylessly
        run: |
          while read -r _ artifact; do
            cosign sign-blob --yes --bundle "evidence/${artifact}.sigstore.json" "evidence/${artifact}"
          done < evidence/PAYLOAD_SHA256SUMS
          cosign sign --yes "${{ steps.image.outputs.image }}@${{ steps.build.outputs.digest }}"

      - name: Generate SLSA provenance
        id: provenance
        uses: actions/attest@v4
        with:
          subject-checksums: evidence/PAYLOAD_SHA256SUMS

      - name: Stage provenance and release manifest
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ steps.release.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_IDENTITY: ${{ github.workflow_ref }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IMAGE_REFERENCE: ${{ steps.image.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          TEST_RUN_URL: ${{ inputs.test_run_url }}
          SECURITY_AUDIT_RUN_URL: ${{ inputs.security_audit_run_url }}
          GA_TAG: ${{ steps.release.outputs.ga_tag }}
          SUPERSEDED_GA_SHA: ${{ steps.release.outputs.existing_ga_sha }}
        run: |
          bundle="${{ steps.provenance.outputs.bundle-path }}"
          while read -r _ artifact; do cp "$bundle" "evidence/${artifact}.intoto.jsonl"; done < evidence/PAYLOAD_SHA256SUMS
          cp scripts/validate-release-manifest.mjs evidence/verify-release.mjs
          cp schemas/release-manifest.schema.json evidence/release-manifest.schema.json
          cp docs/product-support-matrix.json evidence/product-support-matrix.json
          node scripts/generate-release-manifest.mjs evidence evidence/release-manifest.json
          (
            cd evidence
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )
          node evidence/verify-release.mjs evidence/release-manifest.json

      - name: Attest final checksum index
        uses: actions/attest@v4
        with:
          subject-path: evidence/SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: supply-chain-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 90

  verify:
    name: Verify published evidence independently
    needs: artifacts-and-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.artifacts-and-image.outputs.source_sha }}
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Complete recursive submodule checkout
        shell: bash
        run: bash scripts/update-submodules.sh
      - uses: actions/download-artifact@v4
        with:
          name: supply-chain-evidence
          path: evidence
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Verify checksums, signatures, provenance and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd evidence && sha256sum --check SHA256SUMS)
          identity="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/supply-chain.yml@refs/(heads|tags)/"
          while read -r _ artifact; do
            cosign verify-blob --bundle "evidence/${artifact}.sigstore.json" \
              --certificate-identity-regexp "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "evidence/${artifact}"
            gh attestation verify "evidence/${artifact}" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/supply-chain.yml"
          done < evidence/PAYLOAD_SHA256SUMS
          gh attestation verify evidence/SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/supply-chain.yml"
          cosign verify --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ needs.artifacts-and-image.outputs.image }}@${{ needs.artifacts-and-image.outputs.digest }}"
          node evidence/verify-release.mjs evidence/release-manifest.json

      - name: Test downloaded Linux archive install
        run: |
          archive="$(find evidence -maxdepth 1 -name '*linux-x64.tar.gz' -print -quit)"
          test -n "$archive"
          mkdir installed
          tar -xzf "$archive" -C installed
          binary="$(find installed -type f -name universal-agent-runtime -print -quit)"
          test -n "$binary"
          "$binary" --version

  publish-evidence:
    name: Attach verified evidence to release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: supply-chain-evidence
          path: evidence
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: evidence/*
          fail_on_unmatched_files: true
