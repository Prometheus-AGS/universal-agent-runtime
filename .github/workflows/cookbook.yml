name: Cookbook examples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cookbook:
    name: Validate cookbook examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cookbook

      - name: Run cookbook validation
        run: ./tools/validate-cookbook.sh
