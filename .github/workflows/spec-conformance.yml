name: Spec conformance capability matrix

on:
  push:
  pull_request:

jobs:
  capability-matrix:
    name: Capability matrix (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SKIP_MODEL_BUILD: "1"
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Complete recursive submodule checkout
        shell: bash
        run: bash scripts/update-submodules.sh

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config protobuf-compiler

      - name: Cache Cargo registry and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-spec-conformance-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run the capability matrix
        run: UAR_LIVE_INTEGRATION_BACKEND=recorded cargo test --locked --no-default-features --features server-full --test integration live::capability_cases -- --test-threads=1
