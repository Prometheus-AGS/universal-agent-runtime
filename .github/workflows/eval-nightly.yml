name: Eval Nightly

# Tier 2 of the eval gate (decision D-A): a scheduled real-model run of the
# starter suite. Tier 1 (the deterministic, keyless structural test) runs in the
# normal `test` job on every PR. This job degrades gracefully without a key.
on:
  schedule:
    - cron: '0 7 * * *' # daily at 07:00 UTC
  workflow_dispatch:
    inputs:
      update_baseline:
        description: 'Update the committed baseline instead of gating (then commit the result manually)'
        type: boolean
        default: false

jobs:
  eval:
    name: Real-model eval (starter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Complete recursive submodule checkout
        shell: bash
        run: bash scripts/update-submodules.sh

      - name: Guard — require an API key
        id: guard
        env:
          UAR_LLM__API_KEY: ${{ secrets.UAR_LLM__API_KEY }}
        run: |
          if [ -z "${UAR_LLM__API_KEY}" ]; then
            echo "No UAR_LLM__API_KEY secret configured — skipping the real-model eval."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.guard.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        if: steps.guard.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-eval-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build binary
        if: steps.guard.outputs.run == 'true'
        run: cargo build --release --bin universal-agent-runtime --features postgres-backend

      - name: Run eval (gate on regression vs committed baseline)
        if: steps.guard.outputs.run == 'true'
        env:
          UAR_LLM__MODEL: ${{ vars.UAR_EVAL_MODEL || 'openai/gpt-4o-mini' }}
          UAR_LLM__API_KEY: ${{ secrets.UAR_LLM__API_KEY }}
        run: |
          if [ "${{ inputs.update_baseline }}" = "true" ]; then
            ./target/release/universal-agent-runtime eval run evals/starter.yaml \
              --results-dir evals/results --update-baseline
            echo "Baseline written to evals/results/starter.baseline.json — commit it deliberately."
          else
            # Strict: fail loudly if no baseline is committed yet (rather than
            # passing silently). Seed it via workflow_dispatch update_baseline=true.
            ./target/release/universal-agent-runtime eval run evals/starter.yaml \
              --results-dir evals/results --require-baseline
          fi
