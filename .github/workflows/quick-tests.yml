name: Quick Test Suite

on:
  push:
    branches-ignore: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, draft]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  quick-validation:
    name: Quick Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: uar_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
        ports:
          - 5432:5432

      redis:
        image: redis/redis-stack:latest
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Node.js and Bun
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            ~/.bun/install/cache
          key: ${{ runner.os }}-quick-${{ hashFiles('**/Cargo.lock', '**/bun.lockb') }}

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile

      - name: Quick format check
        run: |
          cargo fmt -- --check
          bun run format --check

      - name: Quick lint check
        run: |
          cargo clippy --all-targets -- -D warnings -A clippy::too_many_arguments
          bun run lint

      - name: TypeScript type check
        run: bun run check

      - name: Build project
        run: |
          cargo build --bins --tests
          bun run build

      - name: Run quick tests
        run: |
          chmod +x tools/test-all.sh
          ./tools/test-all.sh --quick
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/uar_test
          REDIS_URL: redis://localhost:6379
          RUST_LOG: info

      - name: Upload basic test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: quick-test-results
          path: |
            test-results/
          retention-days: 3

  # Draft PR validation (even lighter)
  draft-validation:
    name: Draft PR Validation
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == true
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Node.js and Bun
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            ~/.bun/install/cache
          key: ${{ runner.os }}-draft-${{ hashFiles('**/Cargo.lock', '**/bun.lockb') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check compilation
        run: |
          cargo check --all-targets
          bun run check

      - name: Basic format check
        run: |
          cargo fmt -- --check || echo "⚠️ Format issues detected"
          bun run format --check || echo "⚠️ TypeScript format issues detected"

      - name: Comment on draft PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📝 Draft PR Validation Results

              ✅ **Compilation check**: Passed
              ℹ️ **Status**: This is a draft PR - only basic validation was performed.

              When ready for full review:
              1. Mark the PR as "Ready for review"
              2. Full test suite will run automatically
              3. All checks must pass before merge

              🚀 Keep up the great work!`
            });