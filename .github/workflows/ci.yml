name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Rust jobs don't need the embedded frontend bundle or the burn model
  # regen — build.rs otherwise attempts a frontend install via npm (no pnpm
  # on these jobs) and fails. Frontend correctness is covered by the
  # dedicated "Frontend Check" job; the shipped bundle is built by the
  # release/deploy workflows which set up pnpm properly.
  SKIP_FRONTEND_BUILD: "1"
  SKIP_MODEL_BUILD: "1"

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Complete recursive submodule checkout
        shell: bash
        run: bash scripts/update-submodules.sh
      
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      
      - name: Check formatting
        run: cargo fmt --all -- --check

      # Deliberately not --all-features -- three features excluded, each
      # already broken independent of anything in this diff, disclosed here
      # rather than silently worked around:
      #   - model-build (dep:burn-import): a network-dependent, opt-in dev
      #     tool that downloads a fresh ONNX model and regenerates Rust code
      #     from it at build time. Its burn-import/candle-core version pairing
      #     is currently incompatible with the model UAR ships (see
      #     uar-dependabot-remediation-2026-07).
      #   - memory-palace: excluded per its own documented libsqlite3-sys
      #     version conflict in this file's [features] section.
      #   - sandbox-microsandbox: tests/test_sandbox.rs calls
      #     AppConfig::default_for_test(), which does not exist on the
      #     current AppConfig -- a genuine, pre-existing bug in that test
      #     file, unrelated to dependencies or CI config. Needs its own fix,
      #     not bundled into a security-remediation phase.
      #
      # Deliberately no `-- -D warnings`: Cargo.toml's own [lints.clippy]
      # already sets pedantic/complexity/perf/style/suspicious/correctness to
      # `warn` (the project's actual intended policy) -- a CLI `-D warnings`
      # blanket-escalates every one of those to a hard error regardless of
      # that config, which is how this step ended up demanding a zero-warning
      # bar that had never actually been cleared (~500+ pre-existing pedantic
      # warnings accumulated because this step could never reach clippy at
      # all until the fixes above landed). Let Cargo.toml's own levels govern;
      # this step now reports, same as this project's established
      # `cargo clippy --lib` baseline-tracking practice.
      - name: Run clippy
        run: cargo clippy --all-targets --features postgres-backend,tauri,wasm-runtime

      - name: Run cargo check
        run: cargo check --features postgres-backend,tauri,wasm-runtime

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Complete recursive submodule checkout
        shell: bash
        run: bash scripts/update-submodules.sh
      
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
        run: cargo test --features postgres-backend,tauri,wasm-runtime

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Complete recursive submodule checkout
        shell: bash
        run: bash scripts/update-submodules.sh

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config protobuf-compiler

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install protobuf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release

  release-bundles:
    name: Release Bundle (${{ matrix.bundle }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows remains an evidence-producing Experimental target and must not
    # block the Stable Linux/macOS sidecar release profile.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        bundle: [minimal, server-full, desktop-full]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Complete recursive submodule checkout
        shell: bash
        run: bash scripts/update-submodules.sh

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config protobuf-compiler

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install protobuf

      - uses: dtolnay/rust-toolchain@stable

      - name: Check bundle
        env:
          SKIP_CATALOG_BUILD: 1
          SKIP_FRONTEND_BUILD: 1
        run: cargo check --lib --features ${{ matrix.bundle }}

      - name: Test stable minimal bundle
        if: matrix.bundle == 'minimal'
        env:
          SKIP_FRONTEND_BUILD: 1
        run: cargo test --lib --features minimal

  offline-reproducible-build:
    name: Offline Reproducible Source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Complete recursive submodule checkout
        shell: bash
        run: bash scripts/update-submodules.sh

      - uses: dtolnay/rust-toolchain@stable

      - name: Package complete offline source
        run: scripts/package-offline-source.sh dist/uar-offline-source.tar.gz

      - name: Build two isolated offline copies
        shell: bash
        run: |
          mkdir -p /tmp/uar-repro/a /tmp/uar-repro/b
          tar -xzf dist/uar-offline-source.tar.gz -C /tmp/uar-repro/a
          tar -xzf dist/uar-offline-source.tar.gz -C /tmp/uar-repro/b
          epoch="$(git log -1 --format=%ct)"
          for copy in a b; do
            source="/tmp/uar-repro/$copy"
            (
              cd "$source"
              SOURCE_DATE_EPOCH="$epoch" \
                RUSTFLAGS="--remap-path-prefix=$source=/src" \
                CARGO_TARGET_DIR="/tmp/uar-target-$copy" \
                cargo build --locked --offline --release --features minimal \
                  --bin universal-agent-runtime
            )
          done

      - name: Compare declared reproducible outputs
        run: |
          cmp /tmp/uar-target-a/release/universal-agent-runtime /tmp/uar-target-b/release/universal-agent-runtime
          cmp /tmp/uar-repro/a/catalog/provider_catalog.json /tmp/uar-repro/b/catalog/provider_catalog.json
          test -f /tmp/uar-repro/a/vendor/git/LICENSE-MIT
          test -f /tmp/uar-repro/a/vendor/git/prometheus-parking-lot-rs/LICENSE-MIT

  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Complete recursive submodule checkout
        shell: bash
        run: bash scripts/update-submodules.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install workspace
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build entity-management workspace package
        working-directory: frontend
        run: pnpm --filter @prometheus-ags/prometheus-entity-management build

      - name: Type check
        run: pnpm -C frontend typecheck

      - name: Enforce frontend architecture boundaries
        run: pnpm run frontend:boundaries

      - name: Validate product support matrix
        run: pnpm run support-matrix:validate

      - name: Validate documentation truth
        run: pnpm run docs:validate

      - name: Vitest contract tests
        run: pnpm -C frontend test

      - name: Build frontend
        run: pnpm -C frontend build

      - name: CI grep gates (architectural invariants + aesthetic contract)
        run: bash scripts/ci-grep-gates.sh
