name: Storybook visual regression

# Builds frontend/'s Storybook, runs its story-level functional + a11y
# checks (vitest --project=storybook), and publishes to Chromatic for visual
# review on every PR. The literal 16ms/8ms A2UI render-budget gate lives in
# `a2ui-renderer-performance.yml` (Change 17) and already triggers on
# `frontend/packages/a2ui-uar/**`, which covers this change's new stories --
# not duplicated here.
#
# The CHROMATIC_PROJECT_TOKEN repo secret IS configured (set 2026-08-07), so
# the `chromatic` job publishes on every triggering run. The empty-token guard
# on the publish step is retained deliberately: it keeps forks and any future
# token rotation from failing the workflow, degrading to a skip notice instead.
# To rotate: Chromatic project settings -> Manage -> Configure -> project token,
# then `gh secret set CHROMATIC_PROJECT_TOKEN`.

on:
  pull_request:
    paths:
      - 'frontend/src/**'
      - 'frontend/packages/a2ui-uar/**'
      - 'frontend/.storybook/**'
      - 'frontend/src/shared/theme/tokens.css'
      - '.github/workflows/storybook-visual-regression.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/packages/a2ui-uar/**'
      - 'frontend/.storybook/**'
      - 'frontend/src/shared/theme/tokens.css'
      - '.github/workflows/storybook-visual-regression.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Complete recursive submodule checkout
        if: always()
        run: bash scripts/update-submodules.sh

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm -C frontend install --frozen-lockfile

      - name: Build entity-management workspace package
        run: pnpm --filter @prometheus-ags/prometheus-entity-management build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Storybook
        working-directory: frontend
        run: pnpm run build-storybook

      - name: Run story functional + a11y checks
        working-directory: frontend
        run: pnpm exec vitest run --project=storybook

  chromatic:
    needs: test
    runs-on: ubuntu-latest
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Complete recursive submodule checkout
        if: always()
        run: bash scripts/update-submodules.sh

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm -C frontend install --frozen-lockfile

      - name: Build entity-management workspace package
        run: pnpm --filter @prometheus-ags/prometheus-entity-management build

      - name: Publish to Chromatic
        if: ${{ env.CHROMATIC_PROJECT_TOKEN != '' }}
        uses: chromaui/action@v18
        with:
          workingDir: frontend
          projectToken: ${{ env.CHROMATIC_PROJECT_TOKEN }}
          onlyChanged: true

      - name: Skip notice (Chromatic project token unavailable)
        if: ${{ env.CHROMATIC_PROJECT_TOKEN == '' }}
        run: echo "::notice::CHROMATIC_PROJECT_TOKEN resolved empty -- skipping Chromatic publish. The secret is configured on the canonical repo, so this normally means a fork run (secrets are not exposed to forks) or a rotated/removed secret. See this workflow's header comment."
