name: Operational resilience certification

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 0'

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Complete recursive submodule checkout
        shell: bash
        run: bash scripts/update-submodules.sh
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - name: Build an installed server-full archive and image
        run: |
          pnpm install --frozen-lockfile
          pnpm -C frontend install --frozen-lockfile
          pnpm -C frontend --filter @prometheus-ags/prometheus-entity-management build
          pnpm build
          node scripts/validate-static-bundle.mjs static
          cargo build --locked --release --no-default-features --bin universal-agent-runtime --features server-full
          mkdir -p dist/operational-resilience
          cp target/release/universal-agent-runtime dist/operational-resilience/
          cp -R static dist/operational-resilience/static
          mkdir -p dist/operational-resilience/skills
          cp -R crates/prometheus-skill-system/skills dist/operational-resilience/skills/builtin
          cp -R src/uar/runtime/matching/models dist/operational-resilience/models
          cp README.md LICENSE LICENSE-COMMERCIAL.md example.config.yaml dist/operational-resilience/
          tar -czf dist/universal-agent-runtime-linux-x64.tar.gz -C dist operational-resilience
          docker build -t uar-operational-resilience .
      - name: Certify installed lifecycle, failures, load, reconnect, recovery, and soak
        env:
          UAR_INSTALLED_ARTIFACT_DIR: dist
          UAR_CANDIDATE_IMAGE: uar-operational-resilience
          UAR_CANDIDATE_SOURCE_SHA: ${{ github.sha }}
          UAR_CANDIDATE_TAG: operational-resilience-${{ github.run_id }}
          UAR_SOAK_DURATION_SECONDS: 60
        run: |
          bash scripts/certify-operational-resilience.sh
          node scripts/validate-candidate-certification.mjs target/resilience-certification/installed-runtime
      - name: Upload machine-readable evidence and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: operational-resilience-${{ github.run_id }}
          path: target/resilience-certification/
          if-no-files-found: error

  non-root-container:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Complete recursive submodule checkout
        shell: bash
        run: bash scripts/update-submodules.sh
      - name: Build release image
        run: docker build -t uar-resilience .
      - name: Verify non-root writable paths, health, and SIGTERM
        run: |
          mkdir -p "$RUNNER_TEMP/uar-data"
          chmod 0777 "$RUNNER_TEMP/uar-data"
          docker run -d --name uar-resilience --user 65532:65532 \
            -e UAR_LLM__MODEL=openai/gpt-4o \
            -e UAR_LLM__API_KEY=resilience-smoke-placeholder \
            -e UAR_SERVER__HOST=0.0.0.0 \
            -p 1906:1906 -v "$RUNNER_TEMP/uar-data:/var/lib/uar" uar-resilience
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:1906/health && break
            if ! docker inspect -f '{{.State.Running}}' uar-resilience | grep -q true; then
              docker logs uar-resilience
              exit 1
            fi
            sleep 2
          done
          curl --fail http://127.0.0.1:1906/health || {
            docker logs uar-resilience
            exit 1
          }
          # The runtime's configured graceful-shutdown budget is 30 seconds;
          # give Docker an outer margin so it does not send SIGKILL at the same boundary.
          docker stop --timeout 45 uar-resilience
          test "$(docker inspect -f '{{.State.ExitCode}}' uar-resilience)" -eq 0
