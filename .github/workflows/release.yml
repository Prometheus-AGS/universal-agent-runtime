name: Release Pipeline

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish artifacts to an existing GitHub release
        type: boolean
        default: false
  push:
    tags:
      # Candidate tags build the bytes that are certified. GA tags are created
      # later by promote-release-candidate.sh and must never trigger a rebuild.
      - 'v*.*.*-rc.*'
      - 'release-test-*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Match the deterministic BDD fixture model. Archive smoke tests only need a
  # configured provider and inherit the same non-secret placeholder settings.
  UAR_LLM__MODEL: openai/gpt-5.4-mini
  UAR_LLM__API_KEY: release-smoke-placeholder

jobs:
  validate:
    name: Ordinary release gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Complete recursive submodule checkout
        shell: bash
        run: bash scripts/update-submodules.sh

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install root and frontend dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm -C frontend install --frozen-lockfile

      - name: Build entity-management workspace package
        run: pnpm -C frontend --filter @prometheus-ags/prometheus-entity-management build

      - name: Validate formatting and supported bundles
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --no-default-features --lib --features server-full --no-deps
          cargo check --locked --no-default-features --lib --features minimal
          cargo check --locked --no-default-features --lib --features server-full
          cargo check --locked --no-default-features --lib --features desktop-full

      - name: Validate frontend and product contracts
        run: |
          node scripts/validate-release-workflow.mjs
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm run frontend:boundaries
          pnpm run support-matrix:validate
          pnpm run docs:validate
          pnpm build

      - name: Test authoritative server distribution
        run: cargo test --locked --no-default-features --features server-full

  platform-archives:
    name: ${{ matrix.name }} archive install/startup
    needs: validate
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
            archive: universal-agent-runtime-linux-x64.tar.gz
            executable: universal-agent-runtime
            experimental: false
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            archive: universal-agent-runtime-linux-arm64.tar.gz
            executable: universal-agent-runtime
            experimental: false
          - name: macos-x64
            runner: macos-15-intel
            archive: universal-agent-runtime-macos-x64.tar.gz
            executable: universal-agent-runtime
            experimental: false
          - name: macos-arm64
            runner: macos-15
            archive: universal-agent-runtime-macos-arm64.tar.gz
            executable: universal-agent-runtime
            experimental: false
          - name: windows-x64
            runner: windows-latest
            archive: universal-agent-runtime-windows-x64.zip
            executable: universal-agent-runtime.exe
            experimental: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Complete recursive submodule checkout
        shell: bash
        run: bash scripts/update-submodules.sh

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config protobuf-compiler

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install protobuf

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install root and frontend dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm -C frontend install --frozen-lockfile

      - name: Build entity-management workspace package
        run: pnpm -C frontend --filter @prometheus-ags/prometheus-entity-management build

      - name: Build Stable release bundle
        run: |
          pnpm build
          node scripts/validate-static-bundle.mjs static
          cargo build --locked --release --no-default-features --bin universal-agent-runtime --features server-full

      - name: Build Sentry-enabled release bundle
        run: cargo build --locked --release --no-default-features --bin universal-agent-runtime --features server-full,sentry
        env:
          # Sentry is compile-time gated; a DSN is only required at runtime.
          # This build verifies the feature compiles and links cleanly.
          SENTRY_DSN: ""

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.name }}"
          cp target/release/universal-agent-runtime "dist/${{ matrix.name }}/"
          cp -R static "dist/${{ matrix.name }}/static"
          mkdir -p "dist/${{ matrix.name }}/skills"
          cp -R crates/prometheus-skill-system/skills "dist/${{ matrix.name }}/skills/builtin"
          cp -R src/uar/runtime/matching/models "dist/${{ matrix.name }}/models"
          cp README.md LICENSE LICENSE-COMMERCIAL.md example.config.yaml "dist/${{ matrix.name }}/"
          tar -czf "dist/${{ matrix.archive }}" -C dist "${{ matrix.name }}"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist/${{ matrix.name }}" | Out-Null
          Copy-Item target/release/universal-agent-runtime.exe "dist/${{ matrix.name }}/"
          Copy-Item static "dist/${{ matrix.name }}/static" -Recurse
          New-Item -ItemType Directory -Force "dist/${{ matrix.name }}/skills" | Out-Null
          Copy-Item crates/prometheus-skill-system/skills "dist/${{ matrix.name }}/skills/builtin" -Recurse
          Copy-Item src/uar/runtime/matching/models "dist/${{ matrix.name }}/models" -Recurse
          Copy-Item README.md,LICENSE,LICENSE-COMMERCIAL.md,example.config.yaml "dist/${{ matrix.name }}/"
          Compress-Archive -Path "dist/${{ matrix.name }}" -DestinationPath "dist/${{ matrix.archive }}"

      - name: Install and smoke-test Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir installed
          tar -xzf "dist/${{ matrix.archive }}" -C installed
          version_output="$(installed/${{ matrix.name }}/${{ matrix.executable }} --version 2>&1)"
          echo "$version_output"
          case "$version_output" in
            *"universal-agent-runtime 1.0.0"*) ;;
            *) echo "unexpected version output"; exit 1 ;;
          esac
          UAR_STATIC_DIR="installed/${{ matrix.name }}/static" \
            UAR_BUILTIN_SKILLS_DIR="installed/${{ matrix.name }}/skills/builtin" \
            UAR_MODELS_DIR="installed/${{ matrix.name }}/models" \
            installed/${{ matrix.name }}/${{ matrix.executable }} --port 1906 >server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:1906/readyz >/dev/null; then ready=true; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat server.log; exit 1; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat server.log; exit 1; fi
          curl --fail --silent http://127.0.0.1:1906/healthz >/dev/null

      - name: Install and smoke-test Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive "dist/${{ matrix.archive }}" -DestinationPath installed
          $binary = "installed/${{ matrix.name }}/${{ matrix.executable }}"
          (& $binary --version) | Select-String "1.0.0"
          $env:UAR_STATIC_DIR = (Resolve-Path "installed/${{ matrix.name }}/static").Path
          $env:UAR_BUILTIN_SKILLS_DIR = (Resolve-Path "installed/${{ matrix.name }}/skills/builtin").Path
          $env:UAR_MODELS_DIR = (Resolve-Path "installed/${{ matrix.name }}/models").Path
          $process = Start-Process $binary -ArgumentList "--port", "1906" -PassThru -RedirectStandardOutput server.log -RedirectStandardError server-error.log
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if ($process.HasExited) { Get-Content server.log,server-error.log; throw "UAR exited before readiness" }
              try { Invoke-WebRequest http://127.0.0.1:1906/readyz -UseBasicParsing | Out-Null; $ready = $true; break } catch { Start-Sleep 1 }
            }
            if (-not $ready) { Get-Content server.log,server-error.log; throw "UAR readiness timeout" }
            Invoke-WebRequest http://127.0.0.1:1906/healthz -UseBasicParsing | Out-Null
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 90

  offline-source:
    name: Complete offline source archive
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Complete recursive submodule checkout
        shell: bash
        run: bash scripts/update-submodules.sh
      - uses: dtolnay/rust-toolchain@stable
      - name: Package vendored source
        run: scripts/package-offline-source.sh dist/uar-offline-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: offline-source
          path: dist/uar-offline-source.tar.gz
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Attach certified archives
    needs: [platform-archives, offline-source]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        working-directory: artifacts
        run: sha256sum * >SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true
