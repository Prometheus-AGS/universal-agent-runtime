name: Security Audit

# Scheduled dependency vulnerability scan, decoupled from release.yml on
# purpose (decision recorded in uar-dependabot-remediation-2026-07/plan.md):
# release.yml's tag/release trigger answers "when do we cut a release" and
# has never fired in this repo's history, which meant the cargo audit/bun
# audit steps buried in it never ran either. This workflow answers a
# separate question -- "how often do we check for new CVEs" -- on its own
# schedule regardless of release cadence.
on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

jobs:
  rust-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-audit-

      - name: Install cargo-audit
        run: cargo install cargo-audit

      # Ignored IDs are advisories this project has already triaged and
      # disclosed a disposition for in docs/DEPENDENCY_MANAGEMENT.md (fixed
      # where possible, mitigated, or accepted risk with no fix available).
      # A net-new advisory not in this list will fail the job -- that's the
      # signal this workflow exists to surface. Unmaintained/unsound
      # warnings (not CVE-style vulnerabilities) still print but don't fail
      # the job by default; review them periodically via `cargo audit`
      # locally.
      - name: Run cargo audit
        run: |
          # Shrunk 7 -> 3 by re-remediate-stale-rustsec (2026-07-10): hickory
          # advisories cleared by REMOVING the broken sandbox-microsandbox
          # feature; quinn-proto fixed via 0.11.16; lopdf + 2 of 3 quick-xml
          # copies fixed via the Prometheus-AGS/xberg kreuzberg fork (lopdf
          # 0.42, quick-xml 0.41, calamine 0.36, biblib 0.7 — upstream PR
          # filed). Every remaining ignore is genuinely unfixable by us today;
          # full rationale in docs/DEPENDENCY_MANAGEMENT.md.
          cargo audit \
            --ignore RUSTSEC-2026-0194 `# quick-xml 0.39 via opendal 0.57 (LATEST upstream) via liter-llm cache; DoS-class, reachable only with S3-backed cache storage` \
            --ignore RUSTSEC-2026-0195 `# same quick-xml copy as above` \
            --ignore RUSTSEC-2023-0071 `# rsa Marvin: accepted risk, patched=[] (no fix exists)`

  npm-root-audit:
    name: npm audit (root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: npm audit
        run: npm audit

  frontend-audit:
    name: pnpm audit (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install workspace
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        working-directory: frontend
        run: pnpm audit

  sdk-typescript-audit:
    name: npm audit (sdks/typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: Install
        working-directory: sdks/typescript
        run: npm ci

      - name: npm audit
        working-directory: sdks/typescript
        run: npm audit

  dependabot-alerts-gate:
    name: Dependabot alerts gate
    runs-on: ubuntu-latest
    # GITHUB_TOKEN can never read the Dependabot alerts API under any
    # permissions: grant -- a hard Actions platform limitation, not a
    # config gap (see docs/DEPENDENCY_MANAGEMENT.md). SUBMODULES_TOKEN is
    # reused here (already provisioned for private-submodule checkout
    # across every workflow) rather than a new dedicated secret.
    env:
      GH_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
      # Disclosed, already-triaged GHSA IDs -- update this list whenever a
      # new advisory is triaged and disclosed in
      # docs/DEPENDENCY_MANAGEMENT.md (mirrors cargo audit's --ignore
      # convention above).
      DISCLOSED_GHSA_IDS: ""
    steps:
      - name: Check Dependabot alert feed
        run: |
          set -euo pipefail

          if ! RESPONSE=$(gh api "repos/${{ github.repository }}/dependabot/alerts" --paginate 2>&1); then
            echo "::error::Failed to call the Dependabot alerts API (likely 401/403). SUBMODULES_TOKEN may lack the security_events scope (classic PAT) or 'Dependabot alerts: Read' permission (fine-grained token) -- GITHUB_TOKEN can never read this endpoint under any permissions: grant. See docs/DEPENDENCY_MANAGEMENT.md."
            echo "$RESPONSE"
            exit 1
          fi

          echo "$RESPONSE" | python3 -c "
          import json, os, sys

          disclosed = set(os.environ['DISCLOSED_GHSA_IDS'].split())
          alerts = json.loads(sys.stdin.read())
          open_alerts = [a for a in alerts if a.get('state') == 'open']
          undisclosed = [a for a in open_alerts if a['security_advisory']['ghsa_id'] not in disclosed]

          if undisclosed:
              for a in undisclosed:
                  adv = a['security_advisory']
                  pkg = a['dependency']['package']['name']
                  print(f\"::error::{adv['ghsa_id']} ({adv['severity']}) -- {pkg} -- undisclosed open Dependabot alert, not covered by cargo audit/npm audit/pnpm audit's ignore-lists. Triage and disclose in docs/DEPENDENCY_MANAGEMENT.md, then add its GHSA ID to this job's DISCLOSED_GHSA_IDS.\")
              sys.exit(1)

          print(f'All {len(open_alerts)} open Dependabot alert(s) are already disclosed.')
          "
