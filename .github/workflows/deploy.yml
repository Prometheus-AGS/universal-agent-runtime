name: Build and Deploy to AKS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy (defaults to commit SHA)"
        required: false
        type: string
      skip_build:
        description: "Deploy an already-built image without rebuilding"
        required: false
        default: false
        type: boolean

env:
  ACR_NAME: prometheusagsacr
  ACR: prometheusagsacr.azurecr.io
  AKS_CLUSTER: main
  AKS_RG: prometheus-rg
  IMAGE: universal-agent-runtime

jobs:
  # ── 1. Build & Push Docker Image ──────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    # Skipped on manual dispatch with skip_build=true so an already-built image
    # can be deployed without the ~45min Rust/toolchain rebuild.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_build != true }}
    # The image is a ~3GB 5-toolchain build + full Rust release compile; a cold
    # gha cache needs >30min. cache-to: gha,mode=max makes warm runs much faster.
    timeout-minutes: 75

    # Required for Workload Identity Federation: the job must be allowed to
    # request the GitHub OIDC token that azure/login exchanges for Azure
    # credentials. Without `id-token: write` the OIDC auth step fails.
    permissions:
      contents: read
      id-token: write

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Complete recursive submodule checkout
        shell: bash
        run: bash scripts/update-submodules.sh

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: ACR login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Determine image tag
        id: meta
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="${GITHUB_SHA}"
          fi
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${TAG}"

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.ACR }}/${{ env.IMAGE }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.ACR }}/${{ env.IMAGE }}:latest
          # Token for cargo git deps over SSH (kreuzberg) + any private fetches.
          # The Dockerfile rewrites ssh://git@github.com → https with this token.
          secrets: |
            github_token=${{ secrets.SUBMODULES_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Deploy to AKS ─────────────────────────────────────────────────────
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build
    # Run when build succeeded, OR when build was intentionally skipped
    # (skip_build dispatch) — but never if build actually failed/was cancelled.
    if: ${{ always() && needs.build.result != 'failure' && needs.build.result != 'cancelled' }}
    timeout-minutes: 15

    # Azure OIDC token (same as the build job) for the azure/login step.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Complete recursive submodule checkout
        shell: bash
        run: bash scripts/update-submodules.sh

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AKS_RG }}
          cluster-name: ${{ env.AKS_CLUSTER }}

      # Resolve the tag to deploy. Prefer the build job's output; when build was
      # skipped (skip_build dispatch) fall back to the dispatch input, then SHA.
      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ needs.build.outputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${{ inputs.image_tag }}"; fi
          if [ -z "$TAG" ]; then TAG="${GITHUB_SHA}"; fi
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Deploying tag: ${TAG}"

      # Surgical image bump only. The live `uar` namespace is operator-managed
      # (predates this repo): its ConfigMap (Qwen model plane) and Secrets
      # (uar-app-secrets / uar-db-credentials) must NOT be overwritten, so we do
      # NOT `kubectl apply -k` here. We bump only the deployment's image.
      - name: Bump deployment image
        run: |
          kubectl set image deploy/uar \
            uar=${{ env.ACR }}/${{ env.IMAGE }}:${{ steps.tag.outputs.image_tag }} \
            -n uar

      # The deployment is single-replica with ReadWriteOnce PVCs; a RollingUpdate
      # deadlocks on a Multi-Attach error (new pod can't attach the volume the old
      # pod still holds). Scale to 0 to release the volumes, then back to 1.
      - name: Roll via scale 0 -> 1 (RWO volumes)
        run: |
          kubectl scale deploy/uar -n uar --replicas=0
          kubectl wait --for=delete pod -l app.kubernetes.io/name=uar -n uar --timeout=120s || true
          kubectl scale deploy/uar -n uar --replicas=1

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/uar \
            -n uar \
            --timeout=300s

  # ── 3. Smoke Test ─────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 10

    # Azure OIDC token for the azure/login step.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AKS_RG }}
          cluster-name: ${{ env.AKS_CLUSTER }}

      - name: Get UAR service endpoint
        id: endpoint
        run: |
          ENDPOINT=$(kubectl get svc uar-svc -n uar -o jsonpath='{.spec.clusterIP}')
          PORT=$(kubectl get svc uar-svc -n uar -o jsonpath='{.spec.ports[0].port}')
          echo "endpoint=${ENDPOINT}" >> "$GITHUB_OUTPUT"
          echo "port=${PORT}" >> "$GITHUB_OUTPUT"
          echo "Service endpoint: ${ENDPOINT}:${PORT}"

      - name: Verify /readyz
        run: |
          kubectl run smoke-readyz --rm -i --restart=Never \
            --image=curlimages/curl:latest \
            -n uar \
            -- curl -sf -o /dev/null -w "%{http_code}" \
            http://${{ steps.endpoint.outputs.endpoint }}:${{ steps.endpoint.outputs.port }}/readyz \
            | grep -q "200"
          echo "readyz check passed"

      - name: Verify /healthz
        run: |
          kubectl run smoke-healthz --rm -i --restart=Never \
            --image=curlimages/curl:latest \
            -n uar \
            -- curl -sf -o /dev/null -w "%{http_code}" \
            http://${{ steps.endpoint.outputs.endpoint }}:${{ steps.endpoint.outputs.port }}/healthz \
            | grep -q "200"
          echo "healthz check passed"
