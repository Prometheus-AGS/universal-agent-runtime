name: Build and Deploy to GKE

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy (defaults to commit SHA)"
        required: false
        type: string

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: client-cluster
  GKE_ZONE: ${{ secrets.GKE_ZONE || 'us-central1' }}
  REPOSITORY: uar
  IMAGE: universal-agent-runtime

jobs:
  # ── 1. Build & Push Docker Image ──────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-docker.pkg.dev --quiet

      - name: Determine image tag
        id: meta
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="${GITHUB_SHA}"
          fi
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${TAG}"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            us-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ steps.meta.outputs.image_tag }}
            us-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Deploy to GKE ─────────────────────────────────────────────────────
  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Install gke-gcloud-auth-plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet 2>/dev/null || true
          sudo apt-get update && sudo apt-get install -y google-cloud-sdk-gke-gcloud-auth-plugin

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
            --zone ${{ env.GKE_ZONE }} \
            --project ${{ env.PROJECT_ID }}

      - name: Update image in kustomization
        run: |
          cd k8s/base
          kustomize edit set image \
            uar=us-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ needs.build.outputs.image_tag }}

      - name: Apply production overlay
        run: kubectl apply -k k8s/overlays/production/

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/uar \
            -n uar \
            --timeout=300s

  # ── 3. Smoke Test ─────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 10

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Install gke-gcloud-auth-plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet 2>/dev/null || true
          sudo apt-get update && sudo apt-get install -y google-cloud-sdk-gke-gcloud-auth-plugin

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
            --zone ${{ env.GKE_ZONE }} \
            --project ${{ env.PROJECT_ID }}

      - name: Get UAR service endpoint
        id: endpoint
        run: |
          ENDPOINT=$(kubectl get svc uar-svc -n uar -o jsonpath='{.spec.clusterIP}')
          PORT=$(kubectl get svc uar-svc -n uar -o jsonpath='{.spec.ports[0].port}')
          echo "endpoint=${ENDPOINT}" >> "$GITHUB_OUTPUT"
          echo "port=${PORT}" >> "$GITHUB_OUTPUT"
          echo "Service endpoint: ${ENDPOINT}:${PORT}"

      - name: Verify /readyz
        run: |
          kubectl run smoke-readyz --rm -i --restart=Never \
            --image=curlimages/curl:latest \
            -n uar \
            -- curl -sf -o /dev/null -w "%{http_code}" \
            http://${{ steps.endpoint.outputs.endpoint }}:${{ steps.endpoint.outputs.port }}/readyz \
            | grep -q "200"
          echo "readyz check passed"

      - name: Verify /healthz
        run: |
          kubectl run smoke-healthz --rm -i --restart=Never \
            --image=curlimages/curl:latest \
            -n uar \
            -- curl -sf -o /dev/null -w "%{http_code}" \
            http://${{ steps.endpoint.outputs.endpoint }}:${{ steps.endpoint.outputs.port }}/healthz \
            | grep -q "200"
          echo "healthz check passed"
