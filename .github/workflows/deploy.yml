name: Build and Deploy to GKE

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy (defaults to commit SHA)"
        required: false
        type: string

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: client-cluster
  GKE_ZONE: ${{ secrets.GKE_ZONE || 'us-central1' }}
  REPOSITORY: uar
  IMAGE: universal-agent-runtime

jobs:
  # ── 1. Build & Push Docker Image ──────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    # The image is a ~3GB 5-toolchain build + full Rust release compile; a cold
    # gha cache needs >30min. cache-to: gha,mode=max makes warm runs much faster.
    timeout-minutes: 75

    # Required for Workload Identity Federation: the job must be allowed to
    # request the GitHub OIDC token that google-github-actions/auth exchanges
    # for GCP credentials. Without `id-token: write` the auth step fails with
    # "did not inject $ACTIONS_ID_TOKEN_REQUEST_TOKEN".
    permissions:
      contents: read
      id-token: write

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-docker.pkg.dev --quiet

      - name: Determine image tag
        id: meta
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="${GITHUB_SHA}"
          fi
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${TAG}"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            us-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ steps.meta.outputs.image_tag }}
            us-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest
          # Token for cargo git deps over SSH (kreuzberg) + any private fetches.
          # The Dockerfile rewrites ssh://git@github.com → https with this token.
          secrets: |
            github_token=${{ secrets.SUBMODULES_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Deploy to GKE ─────────────────────────────────────────────────────
  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    # WIF OIDC token (same as the build job) for the GKE auth step.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
            --zone ${{ env.GKE_ZONE }} \
            --project ${{ env.PROJECT_ID }}

      # Surgical image bump only. The live `uar` namespace is operator-managed
      # (predates this repo): its ConfigMap (Qwen model plane) and Secrets
      # (uar-app-secrets / uar-db-credentials) must NOT be overwritten, so we do
      # NOT `kubectl apply -k` here. We bump only the deployment's image.
      - name: Bump deployment image
        run: |
          kubectl set image deploy/uar \
            uar=us-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ needs.build.outputs.image_tag }} \
            -n uar

      # The deployment is single-replica with ReadWriteOnce PVCs; a RollingUpdate
      # deadlocks on a Multi-Attach error (new pod can't attach the volume the old
      # pod still holds). Scale to 0 to release the volumes, then back to 1.
      - name: Roll via scale 0 -> 1 (RWO volumes)
        run: |
          kubectl scale deploy/uar -n uar --replicas=0
          kubectl wait --for=delete pod -l app.kubernetes.io/name=uar -n uar --timeout=120s || true
          kubectl scale deploy/uar -n uar --replicas=1

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/uar \
            -n uar \
            --timeout=300s

  # ── 3. Smoke Test ─────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 10

    # WIF OIDC token for the GKE auth step.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
            --zone ${{ env.GKE_ZONE }} \
            --project ${{ env.PROJECT_ID }}

      - name: Get UAR service endpoint
        id: endpoint
        run: |
          ENDPOINT=$(kubectl get svc uar-svc -n uar -o jsonpath='{.spec.clusterIP}')
          PORT=$(kubectl get svc uar-svc -n uar -o jsonpath='{.spec.ports[0].port}')
          echo "endpoint=${ENDPOINT}" >> "$GITHUB_OUTPUT"
          echo "port=${PORT}" >> "$GITHUB_OUTPUT"
          echo "Service endpoint: ${ENDPOINT}:${PORT}"

      - name: Verify /readyz
        run: |
          kubectl run smoke-readyz --rm -i --restart=Never \
            --image=curlimages/curl:latest \
            -n uar \
            -- curl -sf -o /dev/null -w "%{http_code}" \
            http://${{ steps.endpoint.outputs.endpoint }}:${{ steps.endpoint.outputs.port }}/readyz \
            | grep -q "200"
          echo "readyz check passed"

      - name: Verify /healthz
        run: |
          kubectl run smoke-healthz --rm -i --restart=Never \
            --image=curlimages/curl:latest \
            -n uar \
            -- curl -sf -o /dev/null -w "%{http_code}" \
            http://${{ steps.endpoint.outputs.endpoint }}:${{ steps.endpoint.outputs.port }}/healthz \
            | grep -q "200"
          echo "healthz check passed"
