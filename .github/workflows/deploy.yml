name: Build and Deploy to AKS

on:
  push:
    branches:
      - main
    tags:
      - boss-sidecar-win32-x64-v*
      - boss-sidecar-win32-arm64-v*
      - boss-sidecar-darwin-arm64-v*
      - boss-sidecar-darwin-x64-v*
      # Publishes the public multi-arch GHCR image (ghcr-build/ghcr-merge
      # jobs below). Does NOT match the boss-sidecar-*-v* tags above.
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy (defaults to commit SHA)"
        required: false
        type: string
      skip_build:
        description: "Deploy an already-built image without rebuilding"
        required: false
        default: false
        type: boolean

env:
  ACR_NAME: prometheusagsacr
  ACR: prometheusagsacr.azurecr.io
  AKS_CLUSTER: main
  AKS_RG: prometheus-rg
  IMAGE: universal-agent-runtime

jobs:
  # ── 1. Build & Push Docker Image ──────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    # Skipped on manual dispatch with skip_build=true so an already-built image
    # can be deployed without the ~45min Rust/toolchain rebuild. Also skipped
    # on `v*` tag pushes (those exist only to trigger the ghcr-build/ghcr-merge
    # jobs below) so the Azure pipeline's trigger set is unchanged.
    if: ${{ !startsWith(github.ref, 'refs/tags/boss-sidecar-') && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || inputs.skip_build != true) }}
    # The image is a ~3GB 5-toolchain build + full Rust release compile; a cold
    # gha cache needs >30min. cache-to: gha,mode=max makes warm runs much faster.
    timeout-minutes: 75

    # Required for Workload Identity Federation: the job must be allowed to
    # request the GitHub OIDC token that azure/login exchanges for Azure
    # credentials. Without `id-token: write` the OIDC auth step fails.
    permissions:
      contents: read
      id-token: write

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Complete recursive submodule checkout
        shell: bash
        run: bash scripts/update-submodules.sh

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: ACR login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Determine image tag
        id: meta
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="${GITHUB_SHA}"
          fi
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${TAG}"

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.ACR }}/${{ env.IMAGE }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.ACR }}/${{ env.IMAGE }}:latest
          # Token for cargo git deps over SSH (kreuzberg) + any private fetches.
          # The Dockerfile rewrites ssh://git@github.com → https with this token.
          secrets: |
            github_token=${{ secrets.SUBMODULES_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Deploy to AKS ─────────────────────────────────────────────────────
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build
    # Run when build succeeded, OR when build was intentionally skipped
    # (skip_build dispatch) — but never if build actually failed/was cancelled,
    # and never on the `v*` GHCR-publish tags (same gate as the build job).
    if: ${{ always() && !startsWith(github.ref, 'refs/tags/boss-sidecar-') && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && needs.build.result != 'failure' && needs.build.result != 'cancelled' }}
    timeout-minutes: 15

    # Azure OIDC token (same as the build job) for the azure/login step.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Complete recursive submodule checkout
        shell: bash
        run: bash scripts/update-submodules.sh

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v5
        with:
          resource-group: ${{ env.AKS_RG }}
          cluster-name: ${{ env.AKS_CLUSTER }}

      # Resolve the tag to deploy. Prefer the build job's output; when build was
      # skipped (skip_build dispatch) fall back to the dispatch input, then SHA.
      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ needs.build.outputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${{ inputs.image_tag }}"; fi
          if [ -z "$TAG" ]; then TAG="${GITHUB_SHA}"; fi
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Deploying tag: ${TAG}"

      # Surgical image bump only. The live `uar` namespace is operator-managed
      # (predates this repo): its ConfigMap (Qwen model plane) and Secrets
      # (uar-app-secrets / uar-db-credentials) must NOT be overwritten, so we do
      # NOT `kubectl apply -k` here. We bump only the deployment's image.
      - name: Bump deployment image
        run: |
          kubectl set image deploy/uar \
            uar=${{ env.ACR }}/${{ env.IMAGE }}:${{ steps.tag.outputs.image_tag }} \
            -n uar

      # The deployment is single-replica with ReadWriteOnce PVCs; a RollingUpdate
      # deadlocks on a Multi-Attach error (new pod can't attach the volume the old
      # pod still holds). Scale to 0 to release the volumes, then back to 1.
      - name: Roll via scale 0 -> 1 (RWO volumes)
        run: |
          kubectl scale deploy/uar -n uar --replicas=0
          kubectl wait --for=delete pod -l app.kubernetes.io/name=uar -n uar --timeout=120s || true
          kubectl scale deploy/uar -n uar --replicas=1

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/uar \
            -n uar \
            --timeout=300s

  # ── 3. Smoke Test ─────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 10

    # Azure OIDC token for the azure/login step.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v5
        with:
          resource-group: ${{ env.AKS_RG }}
          cluster-name: ${{ env.AKS_CLUSTER }}

      - name: Get UAR service endpoint
        id: endpoint
        run: |
          ENDPOINT=$(kubectl get svc uar-svc -n uar -o jsonpath='{.spec.clusterIP}')
          PORT=$(kubectl get svc uar-svc -n uar -o jsonpath='{.spec.ports[0].port}')
          echo "endpoint=${ENDPOINT}" >> "$GITHUB_OUTPUT"
          echo "port=${PORT}" >> "$GITHUB_OUTPUT"
          echo "Service endpoint: ${ENDPOINT}:${PORT}"

      - name: Verify /readyz
        run: |
          kubectl run smoke-readyz --rm -i --restart=Never \
            --image=curlimages/curl:latest \
            -n uar \
            -- curl -sf -o /dev/null -w "%{http_code}" \
            http://${{ steps.endpoint.outputs.endpoint }}:${{ steps.endpoint.outputs.port }}/readyz \
            | grep -q "200"
          echo "readyz check passed"

      - name: Verify /healthz
        run: |
          kubectl run smoke-healthz --rm -i --restart=Never \
            --image=curlimages/curl:latest \
            -n uar \
            -- curl -sf -o /dev/null -w "%{http_code}" \
            http://${{ steps.endpoint.outputs.endpoint }}:${{ steps.endpoint.outputs.port }}/healthz \
            | grep -q "200"
          echo "healthz check passed"

  # ── 4. GHCR Multi-Arch Publish ───────────────────────────────────────────
  # Publishes a public ghcr.io/prometheus-ags/universal-agent-runtime image so
  # other projects can `docker pull` UAR instead of rebuilding it from source.
  # Independent of the Azure build/deploy/smoke-test jobs above: no shared
  # `needs`, so a failure on either side never blocks the other. Runs on
  # pushes to main, `v*` tags, and workflow_dispatch — never on the
  # boss-sidecar-* tags used by the sidecar release jobs below.
  ghcr-build:
    name: GHCR Build (${{ matrix.platform }})
    if: ${{ !startsWith(github.ref, 'refs/tags/boss-sidecar-') }}
    runs-on: ${{ matrix.runner }}
    # Same rationale as the ACR build job: ~3GB 5-toolchain image, full Rust
    # release compile. Native arm64 runner avoids QEMU emulation entirely.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Complete recursive submodule checkout
        shell: bash
        run: bash scripts/update-submodules.sh

      # GitHub-hosted runners (amd64 and arm64) ship preinstalled toolchains
      # that are unused here but consume disk space the 5-toolchain UAR image
      # build needs. Remove the largest offenders before building.
      - name: Free disk space
        shell: bash
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Set platform pair
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build-by-digest: each arch pushes an untagged manifest and reports its
      # digest; ghcr-merge below assembles the multi-arch manifest list and
      # applies the real tags. Standard docker/build-push-action pattern for
      # multi-platform images across a build matrix.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          # Token for cargo git deps over SSH (kreuzberg) + any private
          # fetches, same as the ACR build job.
          secrets: |
            github_token=${{ secrets.SUBMODULES_TOKEN }}
          outputs: type=image,name=ghcr.io/prometheus-ags/universal-agent-runtime,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=ghcr-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=ghcr-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v5
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  ghcr-merge:
    name: GHCR Merge Manifest
    if: ${{ !startsWith(github.ref, 'refs/tags/boss-sidecar-') }}
    needs: ghcr-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/prometheus-ags/universal-agent-runtime
          tags: |
            type=sha,format=long
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046  # intentional word-splitting: each -t
          # tag and each name@digest must be its own argv element.
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/prometheus-ags/universal-agent-runtime@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/prometheus-ags/universal-agent-runtime:${{ steps.meta.outputs.version }}

  boss-sidecar-build:
    name: The Boss sidecar (${{ matrix.platform }})
    if: ${{ startsWith(github.ref, 'refs/tags/boss-sidecar-') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.platform == 'darwin-x64' && 180 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            startsWith(github.ref_name, 'boss-sidecar-win32-x64-v') && '[{"platform":"win32-x64","runner":"windows-2025","target":"x86_64-pc-windows-msvc"}]' ||
            startsWith(github.ref_name, 'boss-sidecar-win32-arm64-v') && '[{"platform":"win32-arm64","runner":"windows-11-arm","target":"aarch64-pc-windows-msvc"}]' ||
            startsWith(github.ref_name, 'boss-sidecar-darwin-arm64-v') && '[{"platform":"darwin-arm64","runner":"macos-15","target":"aarch64-apple-darwin"}]' ||
            '[{"platform":"darwin-x64","runner":"macos-15-intel","target":"x86_64-apple-darwin"}]'
          ) }}
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
          sparse-checkout: |
            /*
            !/.kbd-orchestrator/
          sparse-checkout-cone-mode: false
      - name: Checkout Rust workspace submodules
        shell: bash
        run: |
          git submodule update --init --depth=1 -- \
            crates/prometheus-skill-system \
            vendor/git/liter-llm \
            vendor/git/rust-mcp-filesystem
      - name: Install pinned Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: boss-sidecar-${{ matrix.platform }}-${{ matrix.target }}-server-full
          workspaces: ". -> target"
          cache-targets: "true"
      - name: Build production sidecar
        run: >-
          cargo build --release --locked --no-default-features
          --features ${{ matrix.platform == 'darwin-x64' && 'server-full,tract-embeddings' || 'server-full' }}
          --bin uar-sidecar --target ${{ matrix.target }}
      - name: Package complete sidecar payload
        env:
          UAR_SIDECAR_FEATURES: ${{ matrix.platform == 'darwin-x64' && 'server-full,tract-embeddings' || 'server-full' }}
        run: node scripts/package-boss-sidecar.mjs ${{ matrix.platform }} ${{ matrix.target }}
      - uses: actions/upload-artifact@v5
        with:
          name: uar-sidecar-${{ matrix.platform }}
          path: |
            dist/boss-sidecar/uar-sidecar-${{ matrix.platform }}.tar.gz
            dist/boss-sidecar/uar-sidecar-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 90

  boss-sidecar-publish:
    name: Publish immutable The Boss sidecar payload
    if: ${{ startsWith(github.ref, 'refs/tags/boss-sidecar-') }}
    needs: boss-sidecar-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: uar-sidecar-*
          path: dist/boss-sidecar
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/boss-sidecar/uar-sidecar-*.tar.gz
          dist/boss-sidecar/uar-sidecar-*.json
          --verify-tag --latest=false --prerelease
          --title "The Boss UAR sidecar ${GITHUB_REF_NAME}"
          --notes "Immutable ${GITHUB_REF_NAME} payload for The Boss. Built natively with the server-full feature; the archive includes local embedding assets, Cedar policies, runtime libraries found beside the binary, licenses, and a checksummed file manifest."
