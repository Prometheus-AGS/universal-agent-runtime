name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SKIP_FRONTEND_BUILD: "1"
  SKIP_MODEL_BUILD: "1"

jobs:
  rust-coverage:
    name: Rust Coverage (${{ matrix.feature-set }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature-set: [minimal, server-full]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Complete recursive submodule checkout
        shell: bash
        run: bash scripts/update-submodules.sh

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ matrix.feature-set }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-coverage-${{ matrix.feature-set }}-

      - name: Run coverage
        run: |
          cargo llvm-cov --locked --no-default-features --features ${{ matrix.feature-set }} \
            --lib --lcov --output-path lcov-${{ matrix.feature-set }}.info \
            --fail-under-lines 60

      - name: Check coverage drift vs baseline
        run: bash tools/coverage-drift.sh lcov-${{ matrix.feature-set }}.info

      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: lcov-${{ matrix.feature-set }}.info
          flags: rust-${{ matrix.feature-set }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  frontend-coverage:
    name: Frontend Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Complete recursive submodule checkout
        shell: bash
        run: bash scripts/update-submodules.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install workspace
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build entity-management workspace package
        working-directory: frontend
        run: pnpm --filter @prometheus-ags/prometheus-entity-management build

      - name: Run coverage
        run: pnpm -C frontend test:coverage

      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
