name: Live Integration Tier

# Feature-correctness gate for the uar-next-harness phase (plan Amendment A2).
# Runs the live integration tier against the RECORDED backend (in-process stub
# LLM) — deterministic, no network model, GitHub-hosted-runner safe. The LIVE
# backend (real proxy at 127.0.0.1:8181) is operator-only via
# scripts/live-integration.sh and is intentionally NOT run in CI.
#
# This workflow is SPLIT into a blocking compile gate and an advisory run,
# because `continue-on-error: true` has now masked two separate build failures:
#
#   1. 2026-07-11 (test-hardening): the tier had never actually run in CI. Its
#      prior green checkmarks came from continue-on-error masking a build
#      failure (missing protoc, now installed below).
#   2. 2026-08-08: tests/integration/live/harness.rs had not compiled since
#      2026-07-14 — 25 days — while CI reported green the entire time. Commit
#      f53b988 changed `start_server` to take `Arc<ConfigManager>` instead of
#      `Arc<AppConfig>` and added a `strict_config` field to `Cli`; harness.rs
#      was last touched 2026-07-11 (7b3b469) and was never updated, producing
#      E0063 and E0308. harness.rs is the boot mechanism for the entire `live::`
#      tier, so baseline_cases, librefang_seam_cases, a2ui_test_trigger_cases,
#      and load_test had all silently stopped running.
#
# Nothing else in CI catches this class of drift: ci.yml's `check` job runs
# `cargo check` and `cargo clippy --lib`, neither of which compiles test
# targets, and its `test` job builds a different feature set
# (postgres-backend,tauri,wasm-runtime) rather than server-full.
#
# Hence the split below: `live-integration-compile` is BLOCKING and needs no
# LLM provider, so a signature change that breaks the harness fails the build
# immediately. `live-integration-recorded` stays ADVISORY for the run itself.

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:

jobs:
  # BLOCKING. Compile-only (`--no-run`), so it needs no provider, no proxy, and
  # no network model — it is deterministic and safe to gate merges on. This is
  # the job that catches harness/production signature drift.
  live-integration-compile:
    name: Live tier compiles (blocking)
    runs-on: ubuntu-latest
    env:
      SKIP_MODEL_BUILD: "1"
    steps:
      - name: Checkout (with submodules — skill pack + entity mgmt)
        uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Complete recursive submodule checkout
        shell: bash
        run: bash scripts/update-submodules.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # build.rs compiles the A2A proto via prost, which needs protoc.
      - name: Install build dependencies (protoc, dbus)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config protobuf-compiler

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-live-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # No continue-on-error. This is the gate.
      - name: Compile integration tests (server-full, no run)
        run: cargo test --locked --no-default-features --features server-full --test integration --no-run

  # ADVISORY. The run itself stays non-blocking pending a real green run of the
  # recorded backend. Promote to blocking once the tests are confirmed passing;
  # the compile gate above is already blocking and covers build drift.
  live-integration-recorded:
    name: Live tier runs, recorded backend (advisory)
    needs: live-integration-compile
    runs-on: ubuntu-latest
    env:
      SKIP_MODEL_BUILD: "1"
      # Default backend is `recorded`; set explicitly for clarity.
      UAR_LIVE_INTEGRATION_BACKEND: "recorded"
    steps:
      - name: Checkout (with submodules — skill pack + entity mgmt)
        uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Complete recursive submodule checkout
        shell: bash
        run: bash scripts/update-submodules.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies (protoc, dbus)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config protobuf-compiler

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-live-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Feature-coverage matrix presence check (task 3.2). For each change
      # referenced in the phase plan, MATRIX.md must contain its CH-## token.
      # Advisory: reports drift without failing the build (yet).
      - name: Matrix presence check
        continue-on-error: true
        run: bash tools/live-matrix-check.sh

      - name: Run live integration tier (recorded backend)
        # Kept ADVISORY pending a confirmed green run. Build drift is no longer
        # masked by this flag — live-integration-compile above is blocking.
        continue-on-error: true
        run: "cargo test --locked --no-default-features --features server-full --test integration live::"
