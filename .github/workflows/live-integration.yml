name: Live Integration Tier

# Feature-correctness gate for the uar-next-harness phase (plan Amendment A2).
# Runs the live integration tier against the RECORDED backend (in-process stub
# LLM) — deterministic, no network model, GitHub-hosted-runner safe. The LIVE
# backend (real proxy at 127.0.0.1:8181) is operator-only via
# scripts/live-integration.sh and is intentionally NOT run in CI.
#
# Both steps remain ADVISORY (`continue-on-error: true`). test-hardening
# (2026-07-11) found this tier had never actually run in CI — its prior green
# checkmarks came from continue-on-error masking a build failure (missing
# protoc, now installed above). Promote the test tier to blocking only after a
# real run confirms it builds AND the tests pass.

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:

jobs:
  live-integration-recorded:
    runs-on: ubuntu-latest
    env:
      SKIP_MODEL_BUILD: "1"
      # Default backend is `recorded`; set explicitly for clarity.
      UAR_LIVE_INTEGRATION_BACKEND: "recorded"
    steps:
      - name: Checkout (with submodules — skill pack + entity mgmt)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Complete recursive submodule checkout
        shell: bash
        run: bash scripts/update-submodules.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # build.rs compiles the A2A proto via prost, which needs protoc. Without
      # this the tier fails at build time (it did — masked by continue-on-error
      # until test-hardening tried to promote it to blocking).
      - name: Install build dependencies (protoc, dbus)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config protobuf-compiler

      # Feature-coverage matrix presence check (task 3.2). For each change
      # referenced in the phase plan, MATRIX.md must contain its CH-## token.
      # Advisory: reports drift without failing the build (yet).
      - name: Matrix presence check
        continue-on-error: true
        run: bash tools/live-matrix-check.sh

      - name: Run live integration tier (recorded backend)
        # Kept ADVISORY: test-hardening discovered this tier had never actually
        # run — its prior green checkmarks came from continue-on-error masking a
        # build failure (missing protoc, fixed above). Promote to blocking only
        # after a real run confirms the tier builds AND the tests pass.
        continue-on-error: true
        run: "cargo test --test integration live::"
