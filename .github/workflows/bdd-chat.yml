name: BDD Chat Scenario Suite

# Behavior-driven coverage of the six load-bearing chat scenarios
# (no-KB, KB-influenced, skill activation, tool calls, agent switching,
# provider/model routing) — see docs/BDD_SCENARIOS.md and
# openspec/changes/archive/ (bdd-chat-scenario-suite) for full design.
#
# Advisory (non-blocking) for now, matching live-integration.yml's own
# precedent for a newly-introduced test tier — one of the six scenarios
# (chat-kb-retrieval) is a confirmed, disclosed, not-yet-fixed real product
# bug (RAG search always returns empty matches), so this suite is
# currently expected to be 5/6 green, not 6/6.

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:

jobs:
  bdd-chat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules — skill pack + entity mgmt)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config protobuf-compiler

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # frontend/ is its own pnpm workspace (own pnpm-lock.yaml), separate
      # from root's — matching ci.yml's "Frontend Check" job. Without this,
      # cargo build's build.rs frontend-bootstrap step fails to resolve the
      # local workspace package `@prometheus-ags/prometheus-entity-management`
      # on a fresh checkout (confirmed via this workflow's 4th real dispatch:
      # "Rolldown failed to resolve import ...prometheus-entity-management").
      - name: Install frontend workspace
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run BDD chat scenario suite
        # Blocking as of test-hardening (2026-07-11): the suite has been green
        # (6/6) on real CI since fix-embeddings-fastembed landed, so a
        # regression here should now fail the workflow rather than be advisory.
        # test:bdd builds the complete React/server-full product first because
        # generated static assets are intentionally absent from fresh checkouts.
        run: pnpm test:bdd

      - name: Upload certification bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-chat-report
          path: |
            tests/bdd/playwright-report/
            tests/bdd/cucumber-report.json
          retention-days: 14
