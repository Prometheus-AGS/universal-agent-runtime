commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  commands:
    github-actions-policy:
      run: pnpm github-actions-policy:validate
    rust-test-baseline:
      run: bash scripts/verify-rust-test-baseline.sh
      glob:
        - "*.rs"
        - "**/*.rs"
        - "Cargo.{toml,lock}"
        - "**/Cargo.{toml,lock}"
        - "rust-toolchain{,.toml}"
        - ".cargo/config{,.toml}"
        - "scripts/verify-rust-test-baseline.sh"
    frontend-lint:
      run: pnpm -C frontend lint
      glob: "frontend/**/*.{ts,tsx}"
    frontend-typecheck:
      run: pnpm -C frontend typecheck
      glob: "frontend/**/*.{ts,tsx}"
